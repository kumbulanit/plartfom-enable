---
- name: Read the LXD bridge settings
  ansible.builtin.command:
    argv: [lxc, network, get, "{{ pelab_lxd_bridge }}", "{{ item.key }}"]
  loop: "{{ lxd_bridge_config | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: lxd_bridge_current
  changed_when: false

- name: Apply LXD bridge settings that differ
  ansible.builtin.command:
    argv: [lxc, network, set, "{{ pelab_lxd_bridge }}", "{{ item.item.key }}", "{{ item.item.value }}"]
  loop: "{{ lxd_bridge_current.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when: item.stdout | trim != item.item.value | string
  changed_when: true

# A container lab host (pelab_container_host) has no udev, so the bridge never appears as a systemd
# device, and its resolver is Docker's: its lab names already resolve through public DNS, and
# nothing on the host needs the *.lxd names.
- name: Resolve container names and the lab domain on the host through the bridge
  ansible.builtin.template:
    src: pelab-lxd-dns.service.j2
    dest: /etc/systemd/system/pelab-lxd-dns.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart LXD bridge DNS
  when: not pelab_container_host | bool

- name: Enable bridge DNS on the host
  ansible.builtin.systemd_service:
    name: pelab-lxd-dns.service
    enabled: true
    state: started
    daemon_reload: true
  when: not pelab_container_host | bool

# The per-link rule above works only when programs ask systemd-resolved, through
# its stub (127.0.0.53). Some VMs link /etc/resolv.conf to resolved's upstream
# list instead, which bypasses it: then no lab name resolves on the host. k3s
# finds the upstream servers by itself when it sees the stub.
- name: Look at the stub resolver and /etc/resolv.conf
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: [/etc/resolv.conf, /run/systemd/resolve/stub-resolv.conf]
  register: lxd_resolv
  when: not pelab_container_host | bool

- name: Send the host's lookups through systemd-resolved
  ansible.builtin.file:
    src: ../run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  when:
    - not pelab_container_host | bool
    - lxd_resolv.results[1].stat.exists
    - lxd_resolv.results[0].stat.lnk_source | default('') == '/run/systemd/resolve/resolv.conf'
