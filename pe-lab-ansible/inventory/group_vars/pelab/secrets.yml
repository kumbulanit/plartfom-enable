---
# Lab credentials. Each secret is generated on first use and stored under
# credentials/ on the control node, so reruns reuse it. To manage them with
# Ansible Vault instead, replace a lookup with a vaulted string.

pelab_gitea_admin_user: pelab-admin
pelab_gitea_admin_email: "pelab-admin@{{ pelab_domain }}"
pelab_gitea_admin_password: >-
  {{ lookup('ansible.builtin.password', pelab_credentials_dir ~ '/gitea-admin.txt', length=24, chars=['ascii_letters', 'digits']) }}

# One password per delegate for the workspace, Gitea and Harbor. The form
# Lab-abcd-efgh-1234 is easy to type and meets Harbor's rules (upper case,
# lower case and a digit). Only the 8 random characters are stored.
pelab_delegate_password_seeds: >-
  {{ query('ansible.builtin.password',
           *(pelab_workspace_names | map('regex_replace', '^', pelab_delegate_password_dir ~ '/') | map('regex_replace', '$', '.txt')),
           length=8, chars=['ascii_lowercase', 'digits']) }}
pelab_delegate_passwords: >-
  {{ dict(pelab_workspace_names
          | zip(pelab_delegate_password_seeds | map('regex_replace', '^(....)(....).*$', 'Lab-\1-\2')
                | zip(pelab_delegate_password_seeds | map('hash', 'sha1') | map('regex_replace', '[^0-9]', '')
                      | map('regex_replace', '^(....).*$', '\1'))
                | map('join', '-'))) }}

# One read-only login, "delegate", that every delegate shares for Argo CD and
# Grafana (the portal keeps its guest sign-in). Same form as the delegate
# passwords; it is printed on every access sheet. Only the 8 random characters
# are stored, plus the salt of the bcrypt hash Argo CD keeps, so reruns change
# nothing. The hash needs the Python packages passlib and bcrypt on the control node.
pelab_viewer_user: delegate
pelab_viewer_password_seed: >-
  {{ lookup('ansible.builtin.password', pelab_credentials_dir ~ '/delegate-viewer.txt', length=8, chars=['ascii_lowercase', 'digits']) }}
pelab_viewer_password: >-
  {{ pelab_viewer_password_seed | regex_replace('^(....)(....).*$', 'Lab-\1-\2') }}-{{
     pelab_viewer_password_seed | hash('sha1') | regex_replace('[^0-9]', '') | regex_replace('^(....).*$', '\1') }}
pelab_viewer_password_bcrypt: >-
  {{ pelab_viewer_password | password_hash('bcrypt',
       lookup('ansible.builtin.password', pelab_credentials_dir ~ '/delegate-viewer-salt.txt', length=21, chars=['ascii_letters', 'digits']) ~ '.',
       rounds=10) }}

# The platform team's role, for delegates (only when pelab_shared_logins is true):
# it may approve pull requests to the environment and policy repositories, and
# nothing else (read access, no push, no merge). Same password form as the
# delegates', kept with theirs so a new cohort gets a new one.
pelab_platform_approver_user: platform-approver
pelab_platform_approver_password_seed: >-
  {{ lookup('ansible.builtin.password', pelab_delegate_password_dir ~ '/' ~ pelab_platform_approver_user ~ '.txt',
            length=8, chars=['ascii_lowercase', 'digits']) }}
pelab_platform_approver_password: >-
  {{ pelab_platform_approver_password_seed | regex_replace('^(....)(....).*$', 'Lab-\1-\2') }}-{{
     pelab_platform_approver_password_seed | hash('sha1') | regex_replace('[^0-9]', '') | regex_replace('^(....).*$', '\1') }}

# Read-only Gitea account for Argo CD and Backstage.
pelab_gitea_bot_password: >-
  {{ lookup('ansible.builtin.password', pelab_credentials_dir ~ '/gitea-bot.txt', length=24, chars=['ascii_letters', 'digits']) }}

# Gitea account the platform applier posts commit statuses with.
pelab_gitea_applier_password: >-
  {{ lookup('ansible.builtin.password', pelab_credentials_dir ~ '/gitea-applier.txt', length=24, chars=['ascii_letters', 'digits']) }}

pelab_harbor_admin_password: >-
  {{ lookup('ansible.builtin.password', pelab_credentials_dir ~ '/harbor-admin.txt', length=24, chars=['ascii_letters', 'digits']) }}
# Harbor encrypts stored registry credentials with this key (exactly 16 characters).
pelab_harbor_secret_key: >-
  {{ lookup('ansible.builtin.password', pelab_credentials_dir ~ '/harbor-secret-key.txt', length=16, chars=['ascii_letters', 'digits']) }}

# Harbor robot the pipelines push with (Harbor wants upper, lower and digits).
pelab_harbor_robot_secret: >-
  {{ lookup('ansible.builtin.password', pelab_credentials_dir ~ '/harbor-robot.txt', length=24, chars=['ascii_letters', 'digits']) }}Aa1

# Encrypts the pipelines' cosign signing key (used only with golden_path_signing: true).
pelab_cosign_password: >-
  {{ lookup('ansible.builtin.password', pelab_credentials_dir ~ '/cosign-password.txt', length=24, chars=['ascii_letters', 'digits']) }}

pelab_keycloak_admin_user: pelab-admin
pelab_keycloak_admin_password: >-
  {{ lookup('ansible.builtin.password', pelab_credentials_dir ~ '/keycloak-admin.txt', length=24, chars=['ascii_letters', 'digits']) }}

pelab_grafana_admin_password: >-
  {{ lookup('ansible.builtin.password', pelab_credentials_dir ~ '/grafana-admin.txt', length=24, chars=['ascii_letters', 'digits']) }}

# SonarQube requires upper, lower, digit and special characters; the suffix guarantees them.
pelab_sonarqube_admin_password: >-
  {{ lookup('ansible.builtin.password', pelab_credentials_dir ~ '/sonarqube-admin.txt', length=20, chars=['ascii_letters', 'digits']) }}-Aa1
pelab_sonarqube_monitoring_passcode: >-
  {{ lookup('ansible.builtin.password', pelab_credentials_dir ~ '/sonarqube-monitoring.txt', length=24, chars=['ascii_letters', 'digits']) }}

pelab_apisix_admin_key: >-
  {{ lookup('ansible.builtin.password', pelab_credentials_dir ~ '/apisix-admin-key.txt', length=32, chars=['hexdigits']) | lower }}
pelab_apisix_viewer_key: >-
  {{ lookup('ansible.builtin.password', pelab_credentials_dir ~ '/apisix-viewer-key.txt', length=32, chars=['hexdigits']) | lower }}

# Optional Docker Hub account for the Harbor proxy cache (raises pull limits).
pelab_dockerhub_username: ""
pelab_dockerhub_token: ""
