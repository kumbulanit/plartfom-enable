<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" role="img" aria-label="What the dashboard reads: metrics and logs from every copy of the service" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>What the dashboard reads: metrics and logs from every copy of the service</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="110" width="170" height="70" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="105.0" y="141.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">hello pods</text><text x="105.0" y="158.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">/metrics · JSON logs</text><text x="105.0" y="173.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">dev, staging, prod</text><rect x="300" y="40" width="160" height="60" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="380.0" y="66.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Prometheus</text><text x="380.0" y="83.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">scrapes /metrics</text><rect x="300" y="190" width="160" height="60" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="380.0" y="216.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Alloy → Loki</text><text x="380.0" y="233.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">collects the logs</text><rect x="570" y="110" width="180" height="70" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="660.0" y="141.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Grafana</text><text x="660.0" y="158.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">Golden path dashboard</text><rect x="570" y="10" width="180" height="56" rx="8" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="660.0" y="34.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Alert</text><text x="660.0" y="51.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">no healthy copy</text><rect x="800" y="200" width="120" height="60" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="5 4"/><text x="860.0" y="226.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">k6</text><text x="860.0" y="243.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">load test</text><polyline points="190,130 300,70" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="253.0" y="104.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">requests,</text><text x="253.0" y="117.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">version, uptime</text><polyline points="190,160 300,220" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="150" y="215" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">one line</text><text x="150" y="229" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">per request</text><polyline points="460,70 570,130" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><polyline points="460,220 570,160" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><polyline points="460,55 570,38" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a-bad)"/><polyline points="800,245 760,245 760,278 105,278 105,180" fill="none" stroke="#7b8794" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-n)"/><text x="432.5" y="271.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">traffic to staging</text></svg>
