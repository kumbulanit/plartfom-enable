<text x="20" y="46"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> git switch -c add-farewell</tspan></text>
<text x="20" y="65"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> echo "Goodbye from $TEAM" &gt;&gt; greeting.txt</tspan></text>
