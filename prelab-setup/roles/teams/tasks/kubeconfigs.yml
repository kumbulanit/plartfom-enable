---
- name: Wait for the delegate tokens
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ teams_users_namespace }}"
    label_selector: pelab.io/token=delegate
  register: teams_tokens
  retries: 12
  delay: 5
  # A failed lookup has no resources: keep trying, and report its message below
  # (no_log hides the result, which holds the tokens).
  until: >-
    teams_tokens.resources | default([]) | selectattr('data.token', 'defined') | list | length
    == pelab_workspace_names | length
  failed_when: false
  no_log: true

- name: Check every delegate has a token
  ansible.builtin.assert:
    that: >-
      teams_tokens.resources | default([]) | selectattr('data.token', 'defined') | list | length
      == pelab_workspace_names | length
    fail_msg: >-
      Kubernetes has {{ teams_tokens.resources | default([]) | selectattr('data.token', 'defined') | list | length }}
      of {{ pelab_workspace_names | length }} delegate tokens in {{ teams_users_namespace }}.
      {{ ('The lookup failed: ' ~ teams_tokens.msg) if teams_tokens.msg is defined else '' }}
      See: sudo k3s kubectl -n {{ teams_users_namespace }} get secrets -l pelab.io/token=delegate
    quiet: true

# The host ID that container root runs as. Read from the map the running
# container uses: volatile.idmap.base reads 0 on some LXD 5.21 hosts (Ubuntu 22.04)
# even though root is shifted to 1000000.
- name: Read the container UID map
  ansible.builtin.command:
    argv: [lxc, config, get, "{{ pelab_workspace_names[0] }}", volatile.last_state.idmap]
  register: teams_idmap
  changed_when: false

- name: Work out the host ID of container root
  ansible.builtin.set_fact:
    teams_idmap_base: >-
      {{ teams_idmap.stdout | from_json | selectattr('Isuid') | selectattr('Nsid', 'equalto', 0)
         | map(attribute='Hostid') | first | int }}

- name: Write the kubeconfig mounted at /etc/pelab/kubeconfig
  ansible.builtin.template:
    src: kubeconfig.yaml.j2
    dest: "{{ pelab_workspaces_host_dir }}/{{ item }}/kubeconfig"
    owner: "{{ teams_idmap_base | int + pelab_workspace_uid | int }}"
    group: "{{ teams_idmap_base | int + pelab_workspace_uid | int }}"
    mode: "0600"
  vars:
    teams_token: "{{ teams_tokens.resources | selectattr('metadata.name', 'equalto', item ~ '-token') | first }}"
    teams_team: "{{ pelab_workspace_teams[item] | default('') }}"
  loop: "{{ pelab_workspace_names }}"
  no_log: true
