---
# Builds the workspace image in a throwaway container and publishes it under
# lxd_image_alias. The build is skipped when the published image already
# carries the fingerprint of the current build script and lab CA.

- name: Create the artifact cache and build directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ lxd_cache_dir }}"
    - "{{ lxd_build_dir }}"

- name: Download pinned tool releases into the cache
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ lxd_cache_dir }}/{{ item.dest }}"
    checksum: "{{ item.checksum | default(omit) }}"
    owner: root
    group: root
    mode: "0644"
    timeout: 120
  loop: "{{ lxd_image_artifacts }}"
  loop_control:
    label: "{{ item.dest }}"
  register: lxd_artifact_download
  retries: 3
  delay: 10
  until: lxd_artifact_download is succeeded

- name: Render the image build script
  ansible.builtin.template:
    src: build-workspace-image.sh.j2
    dest: "{{ lxd_build_dir }}/build-workspace-image.sh"
    owner: root
    group: root
    mode: "0755"

- name: Copy the lab CA into the build directory
  ansible.builtin.copy:
    src: "{{ pelab_tls_dir }}/ca.crt"
    dest: "{{ lxd_build_dir }}/pelab-ca.crt"
    remote_src: true
    owner: root
    group: root
    mode: "0644"

- name: Fingerprint the build inputs
  ansible.builtin.stat:
    path: "{{ lxd_build_dir }}/{{ item }}"
    checksum_algorithm: sha256
  loop:
    - build-workspace-image.sh
    - pelab-ca.crt
  register: lxd_build_inputs

- name: Read the published workspace image
  ansible.builtin.command:
    argv: [lxc, image, show, "{{ lxd_image_alias }}"]
  register: lxd_image_show
  changed_when: false
  failed_when: false

- name: Decide whether the image needs building
  ansible.builtin.set_fact:
    lxd_image_build_id: "{{ (lxd_build_inputs.results | map(attribute='stat.checksum') | join('-') | hash('sha256'))[:16] }}"
    lxd_image_current: "{{ (lxd_image_show.stdout | from_yaml) if lxd_image_show.rc == 0 else {} }}"

- name: Build and publish the workspace image
  when: >-
    lxd_image_force_rebuild | bool
    or (lxd_image_current.properties | default({})).get('pelab.build', '') != lxd_image_build_id
  block:
    - name: Remove a leftover image builder
      community.general.lxd_container:
        name: "{{ lxd_image_builder }}"
        state: absent
        force_stop: true

    - name: Launch the image builder from Ubuntu 24.04
      community.general.lxd_container:
        name: "{{ lxd_image_builder }}"
        state: started
        source:
          type: image
          mode: pull
          server: "{{ lxd_image_source.server }}"
          protocol: "{{ lxd_image_source.protocol }}"
          alias: "{{ lxd_image_source.alias }}"
        profiles: [default]
        config: "{{ lxd_image_builder_config }}"
        devices:
          pelab-cache: {type: disk, source: "{{ lxd_cache_dir }}", path: /mnt/pelab-cache, readonly: "true"}
          pelab-build: {type: disk, source: "{{ lxd_build_dir }}", path: /mnt/pelab-build, readonly: "true"}
        wait_for_ipv4_addresses: true
        timeout: 600

    - name: Wait for cloud-init in the builder
      ansible.builtin.command:
        argv: [lxc, exec, "{{ lxd_image_builder }}", --, cloud-init, status, --wait]
      register: lxd_builder_cloud_init
      changed_when: false
      failed_when: lxd_builder_cloud_init.rc not in [0, 2]

    - name: Run the image build script (takes 10-30 minutes)
      ansible.builtin.command:
        argv: [lxc, exec, "{{ lxd_image_builder }}", --, bash, /mnt/pelab-build/build-workspace-image.sh, "{{ lxd_image_build_id }}"]
      async: "{{ lxd_image_build_timeout }}"
      poll: 30
      changed_when: true

    - name: Stop the image builder
      community.general.lxd_container:
        name: "{{ lxd_image_builder }}"
        state: stopped

    - name: Publish the workspace image
      ansible.builtin.command:
        argv:
          - lxc
          - publish
          - "{{ lxd_image_builder }}"
          - "local:"
          - --alias
          - "{{ lxd_image_alias }}"
          - --reuse
          - --compression
          - zstd
          - "pelab.build={{ lxd_image_build_id }}"
          - "description=PE Lab workspace (Ubuntu 24.04, build {{ lxd_image_build_id }})"
      changed_when: true

    - name: Delete the previous workspace image
      ansible.builtin.command:
        argv: [lxc, image, delete, "{{ lxd_image_current.fingerprint }}"]
      when: lxd_image_current.fingerprint is defined
      changed_when: true

    - name: Remove the image builder
      community.general.lxd_container:
        name: "{{ lxd_image_builder }}"
        state: absent
        force_stop: true
