<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 349" width="900" height="349" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve" style="background:#000;border-radius:10px">
<rect width="900" height="349" rx="10" fill="#000"/>
