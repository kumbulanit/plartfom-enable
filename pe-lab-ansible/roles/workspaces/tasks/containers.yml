---
- name: Create the workspace profile
  community.general.lxd_profile:
    name: "{{ workspaces_profile }}"
    description: PE Lab delegate workspace
    state: present
    config: "{{ workspaces_profile_config }}"
    devices:
      # The dir driver has no quotas, so the root size only applies to zfs.
      root: >-
        {{ {'type': 'disk', 'path': '/', 'pool': pelab_lxd_storage_pool}
           | combine({'size': workspaces_root_size} if pelab_lxd_storage_driver == 'zfs' else {}) }}
      eth0:
        type: nic
        name: eth0
        network: "{{ pelab_lxd_bridge }}"

- name: Create the host directories mounted into each workspace
  ansible.builtin.file:
    path: "{{ workspaces_host_dir }}/{{ item }}/ssh"
    state: directory
    mode: "0755"
  loop: "{{ pelab_workspace_names }}"

- name: Create and start the workspace containers
  community.general.lxd_container:
    name: "{{ item }}"
    state: started
    source:
      type: image
      alias: "{{ pelab_workspace_image }}"
    profiles: ["{{ workspaces_profile }}"]
    config:
      user.pelab.role: workspace
      user.pelab.team: "{{ pelab_workspace_teams[item] | default('none') }}"
    devices:
      eth0:
        type: nic
        name: eth0
        network: "{{ pelab_lxd_bridge }}"
        ipv4.address: "{{ pelab_lxd_subnet_prefix }}.{{ workspaces_ip_offset + idx + 1 }}"
        security.port_isolation: "{{ pelab_lxd_port_isolation | string | lower }}"
      pelab:
        type: disk
        source: "{{ workspaces_host_dir }}/{{ item }}"
        path: /etc/pelab
        readonly: "true"
    wait_for_ipv4_addresses: true
    timeout: 600
  loop: "{{ pelab_workspace_names }}"
  loop_control:
    index_var: idx

- name: Read the container UID map base
  ansible.builtin.command:
    argv: [lxc, config, get, "{{ pelab_workspace_names[0] }}", volatile.idmap.base]
  register: workspaces_idmap_base
  changed_when: false

- name: Record host IDs for container root and the delegate account
  ansible.builtin.set_fact:
    workspaces_root_hostid: "{{ workspaces_idmap_base.stdout | int }}"
    workspaces_user_hostid: "{{ workspaces_idmap_base.stdout | int + pelab_workspace_uid | int }}"

- name: Hand the mounted directories to container root
  ansible.builtin.file:
    path: "{{ workspaces_host_dir }}/{{ item.0 }}{{ item.1 }}"
    state: directory
    owner: "{{ workspaces_root_hostid }}"
    group: "{{ workspaces_root_hostid }}"
    mode: "0755"
  loop: "{{ pelab_workspace_names | product(['', '/ssh']) | list }}"
  loop_control:
    label: "{{ item.0 }}{{ item.1 }}"

- name: Install each delegate's SSH key
  ansible.builtin.copy:
    dest: "{{ workspaces_host_dir }}/{{ item }}/ssh/{{ item }}.keys"
    content: "{{ ([workspaces_pubkeys[item] | trim] + workspaces_instructor_pubkeys) | join('\n') }}\n"
    owner: "{{ workspaces_root_hostid }}"
    group: "{{ workspaces_root_hostid }}"
    mode: "0644"
  loop: "{{ pelab_workspace_names }}"

# The handbook's commands use these, so they work as pasted in every workspace:
#   git clone https://gitea.$DOMAIN/$TEAM/hello
- name: Write each workspace's lab settings (/etc/pelab/env)
  ansible.builtin.copy:
    dest: "{{ workspaces_host_dir }}/{{ item }}/env"
    content: |
      # Written by the lab build. Who you are, your team, and the lab's domain.
      export ME={{ item }}
      export TEAM={{ pelab_workspace_teams[item] | default('') }}
      export DOMAIN={{ pelab_domain }}
    owner: "{{ workspaces_root_hostid }}"
    group: "{{ workspaces_root_hostid }}"
    mode: "0644"
  loop: "{{ pelab_workspace_names }}"

- name: Write code-server settings
  ansible.builtin.template:
    src: code-server.yaml.j2
    dest: "{{ workspaces_host_dir }}/{{ item }}/code-server.yaml"
    owner: "{{ workspaces_user_hostid }}"
    group: "{{ workspaces_user_hostid }}"
    mode: "0600"
  loop: "{{ pelab_workspace_names }}"
  no_log: true
  notify: Restart code-server
