<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 425" width="900" height="425" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve" style="background:#000;border-radius:10px">
<rect width="900" height="425" rx="10" fill="#000"/>
<rect width="900" height="28" rx="10" fill="#21262d"/><rect y="18" width="900" height="10" fill="#21262d"/>
<circle cx="20" cy="14" r="6" fill="#ff5f56"/><circle cx="40" cy="14" r="6" fill="#ffbd2e"/><circle cx="60" cy="14" r="6" fill="#27c93f"/>
<rect x="686" y="5" width="204" height="18" rx="9" fill="#d29922"/><text x="788" y="18" fill="#000" font-size="11" font-weight="bold" text-anchor="middle">EXAMPLE · DO NOT COPY</text>
<text x="450" y="19" fill="#8b949e" font-size="12" text-anchor="middle">Workspace terminal</text>
<text x="20" y="46"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> git switch -c $TEAM-status-page</tspan></text>
<text x="20" y="65"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> cp examples/exception-template.yaml exceptions/$TEAM-status-page.yaml</tspan></text>
<text x="20" y="84"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> sed -i "s/team01/$TEAM/g; s/student01/$ME/" exceptions/$TEAM-status-page.yaml</tspan></text>
<text x="20" y="103"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> sed -i "s/pelab.io\/expires: .*/pelab.io\/expires: \"$(date -d '+7 days' +%F)\"/" exceptions/$</tspan></text>
<text x="20" y="122" fill="#f0f6fc">TEAM-status-page.yaml</text>
<text x="20" y="141"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> cat exceptions/$TEAM-status-page.yaml</tspan></text>
<text x="20" y="160" fill="#c9d1d9">metadata:</text>
<text x="20" y="179" fill="#c9d1d9">  name: team03-status-page            # CHANGE: &lt;team&gt;-&lt;what&gt;, lowercase</text>
<text x="20" y="198" fill="#c9d1d9">  namespace: pelab-exceptions       # exceptions only count in this namespace</text>
<text x="20" y="217" fill="#c9d1d9">  annotations:</text>
<text x="20" y="236" fill="#c9d1d9">    pelab.io/requested-by: student12  # CHANGE: your user name</text>
<text x="20" y="255" fill="#c9d1d9">    pelab.io/reason: &gt;-               # CHANGE: why the golden path cannot be used, in one or tw</text>
<text x="20" y="274" fill="#c9d1d9">o sentences</text>
<text x="20" y="293" fill="#c9d1d9">      We need a status page for the demo this week and there is no</text>
<text x="20" y="312" fill="#c9d1d9">      golden-path image for it yet.</text>
<text x="20" y="331" fill="#c9d1d9">    pelab.io/expires: "2026-11-09"</text>
<text x="20" y="350" fill="#c9d1d9">...</text>
<text x="20" y="369" fill="#c9d1d9">          namespaces: [team03-dev]    # CHANGE: your team's namespace</text>
<text x="20" y="388" fill="#c9d1d9">          names: [status-page*]       # CHANGE: the workload's name (pods add a suffix)</text>
</svg>
