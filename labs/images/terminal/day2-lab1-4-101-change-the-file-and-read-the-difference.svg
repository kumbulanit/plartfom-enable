<rect x="686" y="5" width="204" height="18" rx="9" fill="#d29922"/><text x="788" y="18" fill="#000" font-size="11" font-weight="bold" text-anchor="middle">EXAMPLE · DO NOT COPY</text>
<text x="450" y="19" fill="#8b949e" font-size="12" text-anchor="middle">Workspace terminal</text>
<text x="20" y="46"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> sed -i "s/Hello/Good morning/" greeting.txt</tspan></text>
<text x="20" y="65"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> echo "Owner: $ME" &gt;&gt; greeting.txt</tspan></text>
<text x="20" y="84"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> git diff</tspan></text>
<text x="20" y="103" fill="#c9d1d9">diff --git a/greeting.txt b/greeting.txt</text>
<text x="20" y="122" fill="#c9d1d9">index f42170f..ab65d5d 100644</text>
<text x="20" y="141" fill="#c9d1d9">--- a/greeting.txt</text>
<text x="20" y="160" fill="#c9d1d9">+++ b/greeting.txt</text>
<text x="20" y="179" fill="#79c0ff">@@ -1 +1,2 @@</text>
