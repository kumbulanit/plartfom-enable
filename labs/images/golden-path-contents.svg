<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="What one golden-path request gives a team" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>What one golden-path request gives a team</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="380" y="20" width="240" height="64" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="500.0" y="48.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Template: "new service"</text><text x="500.0" y="65.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">fill in a name, about a minute</text><rect x="20" y="170" width="150" height="60" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="95.0" y="196.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Repository</text><text x="95.0" y="213.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">code and tests</text><polyline points="500,84 500,125 95,125 95,170" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><rect x="182" y="170" width="150" height="60" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="257.0" y="196.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Pipeline</text><text x="257.0" y="213.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">lint, test, scan, build</text><polyline points="500,84 500,125 257,125 257,170" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><rect x="344" y="170" width="150" height="60" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="419.0" y="196.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Deploy config</text><text x="419.0" y="213.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">dev, staging, prod</text><polyline points="500,84 500,125 419,125 419,170" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><rect x="506" y="170" width="150" height="60" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="581.0" y="196.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Catalogue entry</text><text x="581.0" y="213.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">owner, API, docs</text><polyline points="500,84 500,125 581,125 581,170" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><rect x="668" y="170" width="150" height="60" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="743.0" y="196.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Dashboard</text><text x="743.0" y="213.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">versions, traffic, logs</text><polyline points="500,84 500,125 743,125 743,170" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><rect x="830" y="170" width="150" height="60" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="905.0" y="196.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Guardrails</text><text x="905.0" y="213.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">rules apply at once</text><polyline points="500,84 500,125 905,125 905,170" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="20" y="275" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">Every new service starts with the controls already in place: nobody has to remember to add tests, scanning,</text><text x="20" y="289" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">an owner or a dashboard. That is how a platform makes the safe way the easy way (Day 4 Lab 3 does exactly this).</text></svg>
