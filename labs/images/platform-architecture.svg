<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Inside the platform: how the pieces talk" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>Inside the platform: how the pieces talk</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="200" width="140" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="90.0" y="228.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">You</text><text x="90.0" y="245.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">browser workspace</text><rect x="210" y="70" width="160" height="60" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="290.0" y="96.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Backstage</text><text x="290.0" y="113.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">portal, templates</text><rect x="210" y="270" width="160" height="60" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="290.0" y="296.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Gitea</text><text x="290.0" y="313.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">code, pull requests</text><rect x="430" y="270" width="160" height="60" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="510.0" y="296.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Gitea Actions</text><text x="510.0" y="313.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">pipeline runner</text><rect x="430" y="380" width="160" height="60" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="510.0" y="406.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Harbor</text><text x="510.0" y="423.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">images, scans, SBOM</text><rect x="640" y="270" width="140" height="60" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="710.0" y="296.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Argo CD</text><text x="710.0" y="313.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">deploys what Git says</text><rect x="640" y="60" width="140" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="710.0" y="88.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Grafana</text><text x="710.0" y="105.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">Prometheus, Loki</text><rect x="820" y="150" width="160" height="300" rx="10" fill="#ffffff" stroke="#7b8794" stroke-width="1.5"/><text x="900" y="172" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">k3s cluster</text><rect x="840" y="185" width="120" height="46" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="900.0" y="213.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">teamNN-dev</text><rect x="840" y="243" width="120" height="46" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="900.0" y="271.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">teamNN-staging</text><rect x="840" y="301" width="120" height="46" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="900.0" y="329.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">teamNN-prod</text><rect x="840" y="375" width="120" height="58" rx="8" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="900.0" y="400.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Kyverno</text><text x="900.0" y="417.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">checks every pod</text><polyline points="160,220 210,110" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="193.0" y="169.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">find, create</text><polyline points="160,245 210,290" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="193.0" y="271.5" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">git push</text><polyline points="290,130 290,270" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="298.0" y="204.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">template</text><text x="298.0" y="217.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">creates repo</text><polyline points="370,300 430,300" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="400.0" y="293.0" font-size="11" font-weight="400" fill="#2563eb" text-anchor="middle">runs</text><polyline points="510,330 510,380" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="518.0" y="359.0" font-size="11" font-weight="400" fill="#2563eb" text-anchor="start">pushes image</text><polyline points="330,270 330,240 710,240 710,270" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="520.0" y="233.0" font-size="11" font-weight="400" fill="#2563eb" text-anchor="middle">watches deploy/ in Git</text><polyline points="780,300 840,300" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="810.0" y="293.0" font-size="11" font-weight="400" fill="#2563eb" text-anchor="middle">syncs</text><polyline points="590,410 820,410" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="705.0" y="426.0" font-size="11" font-weight="400" fill="#2563eb" text-anchor="middle">images pulled</text><polyline points="900,150 900,92 780,92" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="840.0" y="85.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">metrics, logs</text><text x="20" y="340" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">You touch two things:</text><text x="20" y="354" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">the workspace and</text><text x="20" y="368" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">the pull request.</text><text x="20" y="382" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">Blue is automatic.</text></svg>
