<circle cx="20" cy="14" r="6" fill="#ff5f56"/><circle cx="40" cy="14" r="6" fill="#ffbd2e"/><circle cx="60" cy="14" r="6" fill="#27c93f"/>
<rect x="686" y="5" width="204" height="18" rx="9" fill="#d29922"/><text x="788" y="18" fill="#000" font-size="11" font-weight="bold" text-anchor="middle">EXAMPLE · DO NOT COPY</text>
<text x="450" y="19" fill="#8b949e" font-size="12" text-anchor="middle">Workspace terminal</text>
<text x="20" y="46"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> mkdir -p ~/day3 &amp;&amp; cd ~/day3</tspan></text>
<text x="20" y="65"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> cat &gt; main.tf &lt;&lt;'EOF'</tspan></text>
<text x="20" y="84"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> terraform {</tspan></text>
<text x="20" y="103"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc">   required_providers {</tspan></text>
<text x="20" y="122"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc">     local = { source = "hashicorp/local" }</tspan></text>
<text x="20" y="141"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc">   }</tspan></text>
<text x="20" y="160"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> }</tspan></text>
<text x="20" y="179"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> </tspan></text>
<text x="20" y="198"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> resource "local_file" "note" {</tspan></text>
<text x="20" y="217"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc">   filename = "${path.module}/note.txt"</tspan></text>
<text x="20" y="236"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc">   content  = "Built by code, not by hand."</tspan></text>
<text x="20" y="255"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> }</tspan></text>
<text x="20" y="274"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> EOF</tspan></text>
<text x="20" y="293"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> ls</tspan></text>
<text x="20" y="312" fill="#c9d1d9">main.tf</text>
