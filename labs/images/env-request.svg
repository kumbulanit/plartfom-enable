<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-label="Requesting environments: a pull request with a plan, approved by the platform team, applied by the platform" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>Requesting environments: a pull request with a plan, approved by the platform team, applied by the platform</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="50" width="160" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="100.0" y="78.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">teamNN.tf</text><text x="100.0" y="95.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">6 lines: team, envs, size</text><rect x="240" y="50" width="170" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="325.0" y="78.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Pull request</text><text x="325.0" y="95.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">platform/environments</text><rect x="470" y="10" width="190" height="60" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="565.0" y="36.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">plan pipeline</text><text x="565.0" y="53.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">read-only: shows 16 to add</text><rect x="470" y="100" width="190" height="60" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="565.0" y="126.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">platform-approver</text><text x="565.0" y="143.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">Review → Approve</text><rect x="720" y="50" width="120" height="64" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="780.0" y="78.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">main</text><text x="780.0" y="95.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">merged</text><rect x="720" y="190" width="260" height="64" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="850.0" y="218.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Platform applier (every 2 min)</text><text x="850.0" y="235.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">tofu apply · posts platform/apply</text><rect x="20" y="190" width="330" height="64" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="185.0" y="218.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">teamNN-staging · teamNN-prod</text><text x="185.0" y="235.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">namespace, budget (quota), limits, rules</text><polyline points="180,82 240,82" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="210.0" y="75.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">git push</text><polyline points="410,72 470,42" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><polyline points="410,92 470,128" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><polyline points="660,42 720,72" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><polyline points="660,128 720,96" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="690" y="34" font-size="11" font-weight="400" fill="#2563eb" text-anchor="middle">green</text><text x="690" y="140" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">approved</text><polyline points="780,114 780,190" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="788.0" y="156.0" font-size="11" font-weight="400" fill="#2563eb" text-anchor="start">fetches main</text><polyline points="720,222 350,222" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="535.0" y="215.0" font-size="11" font-weight="400" fill="#2563eb" text-anchor="middle">creates</text><text x="400" y="280" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">No pipeline can change the cluster: only the applier does, from what was approved.</text></svg>
