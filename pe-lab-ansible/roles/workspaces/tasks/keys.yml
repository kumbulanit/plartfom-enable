---
- name: Create the credentials directory on the control node
  ansible.builtin.file:
    path: "{{ pelab_credentials_dir }}/ssh"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Look for delegate public keys in files/ssh-keys
  ansible.builtin.stat:
    path: "{{ workspaces_ssh_keys_dir }}/{{ item }}.pub"
  loop: "{{ pelab_workspace_names }}"
  register: workspaces_provided_keys
  delegate_to: localhost
  become: false

- name: Generate key pairs for workspaces without a provided key
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -q
      - -t
      - ed25519
      - -N
      - ""
      - -C
      - "{{ item.item }}@{{ pelab_domain }}"
      - -f
      - "{{ pelab_credentials_dir }}/ssh/{{ item.item }}"
    creates: "{{ pelab_credentials_dir }}/ssh/{{ item.item }}"
  loop: "{{ workspaces_provided_keys.results | rejectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"
  when: workspaces_generate_ssh_keys | bool
  delegate_to: localhost
  become: false

- name: Collect the public key of each workspace
  ansible.builtin.set_fact:
    workspaces_pubkeys: >-
      {{ workspaces_pubkeys | default({}) | combine({item.item: lookup('ansible.builtin.file',
           item.stat.path if item.stat.exists else pelab_credentials_dir ~ '/ssh/' ~ item.item ~ '.pub')}) }}
  loop: "{{ workspaces_provided_keys.results }}"
  loop_control:
    label: "{{ item.item }}"
