---
- name: Wait for the Kubernetes API
  kubernetes.core.k8s_cluster_info:
  register: platform_cluster_info
  retries: 20
  delay: 10
  until: platform_cluster_info is succeeded

- name: Create the platform namespaces
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ item }}"
        labels:
          pelab.io/tier: platform
  loop: "{{ platform_namespaces }}"

- name: Read the lab certificate, key and CA
  ansible.builtin.slurp:
    src: "{{ pelab_tls_dir }}/{{ item }}"
  loop: [tls.crt, tls.key, ca.crt]
  register: platform_tls_files
  no_log: true

- name: Keep the lab CA for chart values
  ansible.builtin.set_fact:
    platform_ca_pem: "{{ platform_tls_files.results[2].content | b64decode }}"

- name: Install the wildcard TLS secret in each namespace
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      type: kubernetes.io/tls
      metadata:
        name: "{{ pelab_tls_secret_name }}"
        namespace: "{{ item }}"
      data:
        tls.crt: "{{ platform_tls_files.results[0].content }}"
        tls.key: "{{ platform_tls_files.results[1].content }}"
  loop: "{{ ['kube-system'] + platform_namespaces }}"
  no_log: true

- name: Publish the lab CA in each namespace
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: pelab-ca
        namespace: "{{ item }}"
      data:
        ca.crt: "{{ platform_ca_pem }}"
  loop: "{{ platform_namespaces }}"

- name: Create admin credential secrets
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: "{{ item.name }}"
        namespace: "{{ item.namespace }}"
      stringData: "{{ item.data }}"
  # Only for the releases that are installed (extras create their namespace when enabled).
  loop: "{{ platform_admin_secrets | selectattr('release', 'in', platform_enabled_names) | list }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.name }}"
  no_log: true

# Prometheus and Alertmanager have no login of their own. Traefik asks for the
# delegates' shared read-only one in front of their Ingresses (basic auth, the
# browser's own prompt): a Secret with the htpasswd line and the Middleware
# that reads it, both called platform_monitoring_login in the monitoring
# namespace. The kube-prometheus-stack values put the Middleware on both
# Ingresses; Grafana reaches both services inside the cluster, not through them.
- name: Wait for Traefik's custom resources (k3s installs Traefik once the API is up)
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: middlewares.traefik.io
  register: platform_traefik_crd
  retries: 30
  delay: 10
  until: platform_traefik_crd.resources | length > 0

- name: Ask for the delegates' login in front of Prometheus and Alertmanager
  kubernetes.core.k8s:
    state: present
    apply: true
    definition: "{{ lookup('ansible.builtin.template', 'manifests/monitoring-login.yaml.j2') | ansible.builtin.from_yaml_all | list }}"
  no_log: true
