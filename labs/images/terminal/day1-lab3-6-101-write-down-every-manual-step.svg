<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 634" width="900" height="634" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve">
<rect width="900" height="634" rx="10" fill="#0d1117"/>
<rect width="900" height="28" rx="10" fill="#21262d"/><rect y="18" width="900" height="10" fill="#21262d"/>
<circle cx="20" cy="14" r="6" fill="#ff5f56"/><circle cx="40" cy="14" r="6" fill="#ffbd2e"/><circle cx="60" cy="14" r="6" fill="#27c93f"/>
<text x="450" y="19" fill="#8b949e" font-size="12" text-anchor="middle">Workspace terminal</text>
<text x="20" y="46"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> mkdir -p ~/day1</tspan></text>
<text x="20" y="65"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> cat &gt; ~/day1/manual-steps.md &lt;&lt;'EOF'</tspan></text>
<text x="20" y="84"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> # Day 1: hello by hand, every manual step</tspan></text>
<text x="20" y="103"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> 1. Told Git my name and e-mail address</tspan></text>
<text x="20" y="122"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> 2. Copied (cloned) the repository from Gitea, with my password</tspan></text>
<text x="20" y="141"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> 3. Went into the folder</tspan></text>
<text x="20" y="160"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> 4. Started the service by hand, in a terminal that stays busy</tspan></text>
<text x="20" y="179"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> 5. Opened a second terminal and called the service</tspan></text>
<text x="20" y="198"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> 6. Called its health check</tspan></text>
<text x="20" y="217"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> 7. Stopped it with Ctrl+C</tspan></text>
<text x="20" y="236"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> 8. Typed three settings by hand (APP_ENV, GREETING, PORT) and started it again</tspan></text>
<text x="20" y="255"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> 9. Called it again, on the new port</tspan></text>
<text x="20" y="274"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> 10. Read its log and its metrics</tspan></text>
<text x="20" y="293"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> </tspan></text>
<text x="20" y="312"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> For 25 people, three environments and a change every day, this would take:</tspan></text>
<text x="20" y="331"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> EOF</tspan></text>
<text x="20" y="350"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> cat ~/day1/manual-steps.md</tspan></text>
<text x="20" y="369" fill="#c9d1d9"># Day 1: hello by hand, every manual step</text>
<text x="20" y="388" fill="#c9d1d9">1. Told Git my name and e-mail address</text>
<text x="20" y="407" fill="#c9d1d9">2. Copied (cloned) the repository from Gitea, with my password</text>
<text x="20" y="426" fill="#c9d1d9">3. Went into the folder</text>
<text x="20" y="445" fill="#c9d1d9">4. Started the service by hand, in a terminal that stays busy</text>
<text x="20" y="464" fill="#c9d1d9">5. Opened a second terminal and called the service</text>
<text x="20" y="483" fill="#c9d1d9">6. Called its health check</text>
<text x="20" y="502" fill="#c9d1d9">7. Stopped it with Ctrl+C</text>
<text x="20" y="521" fill="#c9d1d9">8. Typed three settings by hand (APP_ENV, GREETING, PORT) and started it again</text>
<text x="20" y="540" fill="#c9d1d9">9. Called it again, on the new port</text>
<text x="20" y="559" fill="#c9d1d9">10. Read its log and its metrics</text>
<text x="20" y="578" fill="#c9d1d9"></text>
<text x="20" y="597" fill="#c9d1d9">For 25 people, three environments and a change every day, this would take:</text>
</svg>
