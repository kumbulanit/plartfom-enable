<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="The layers of a Linux computer" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>The layers of a Linux computer</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="20" width="560" height="58" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="320.0" y="45.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">You</text><text x="320.0" y="62.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">type a command in the terminal</text><rect x="40" y="94" width="560" height="58" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="320.0" y="119.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Shell (bash)</text><text x="320.0" y="136.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">reads your command and starts the program</text><rect x="40" y="168" width="560" height="58" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="320.0" y="193.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Programs</text><text x="320.0" y="210.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">git, python3, curl, docker, kubectl</text><rect x="40" y="242" width="560" height="58" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="320.0" y="267.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Linux kernel</text><text x="320.0" y="284.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">runs processes, manages memory, files and network, enforces permissions</text><rect x="40" y="316" width="560" height="58" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="5 4"/><text x="320.0" y="341.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Hardware</text><text x="320.0" y="358.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">processor, memory, disk, network card (here: the lab server)</text><polyline points="320,78 320,94" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><polyline points="320,152 320,168" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><polyline points="320,226 320,242" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><polyline points="320,300 320,316" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="640" y="60" font-size="12" font-weight="400" fill="#616e7c" text-anchor="start">Windows has the same layers:</text><text x="640" y="74" font-size="12" font-weight="400" fill="#616e7c" text-anchor="start">a different kernel, and</text><text x="640" y="88" font-size="12" font-weight="400" fill="#616e7c" text-anchor="start">PowerShell or cmd as the shell.</text><text x="640" y="200" font-size="12" font-weight="400" fill="#616e7c" text-anchor="start">A container (Day 4) shares the</text><text x="640" y="214" font-size="12" font-weight="400" fill="#616e7c" text-anchor="start">kernel of the machine it runs on:</text><text x="640" y="228" font-size="12" font-weight="400" fill="#616e7c" text-anchor="start">that is why containers are</text><text x="640" y="242" font-size="12" font-weight="400" fill="#616e7c" text-anchor="start">small and start in a second.</text></svg>
