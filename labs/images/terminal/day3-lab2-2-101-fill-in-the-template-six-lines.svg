<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 406" width="900" height="406" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve" style="background:#000;border-radius:10px">
<rect width="900" height="406" rx="10" fill="#000"/>
<rect width="900" height="28" rx="10" fill="#21262d"/><rect y="18" width="900" height="10" fill="#21262d"/>
<circle cx="20" cy="14" r="6" fill="#ff5f56"/><circle cx="40" cy="14" r="6" fill="#ffbd2e"/><circle cx="60" cy="14" r="6" fill="#27c93f"/>
<rect x="686" y="5" width="204" height="18" rx="9" fill="#d29922"/><text x="788" y="18" fill="#000" font-size="11" font-weight="bold" text-anchor="middle">EXAMPLE · DO NOT COPY</text>
<text x="450" y="19" fill="#8b949e" font-size="12" text-anchor="middle">Workspace terminal</text>
<text x="20" y="46"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> cp team00.tf.example $TEAM.tf</tspan></text>
<text x="20" y="65"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> sed -i "s/team00/$TEAM/g" $TEAM.tf</tspan></text>
<text x="20" y="84"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> cat $TEAM.tf</tspan></text>
<text x="20" y="103"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> git status</tspan></text>
<text x="20" y="122" fill="#c9d1d9"># Your team's request: a copy of this file named after your team (team01.tf for</text>
<text x="20" y="141" fill="#c9d1d9"># example), with your team's name in both places below. The plan in the pull</text>
<text x="20" y="160" fill="#c9d1d9"># request shows what will be created before anything changes.</text>
<text x="20" y="179" fill="#c9d1d9"></text>
<text x="20" y="198" fill="#c9d1d9">module "team03" {</text>
<text x="20" y="217" fill="#c9d1d9">  source       = "./modules/team-environment"</text>
<text x="20" y="236" fill="#c9d1d9">  team         = "team03"</text>
<text x="20" y="255" fill="#c9d1d9">  environments = ["staging", "prod"]</text>
<text x="20" y="274" fill="#c9d1d9">  size         = "small"</text>
<text x="20" y="293" fill="#c9d1d9">}</text>
<text x="20" y="312" fill="#c9d1d9">On branch team03-environments</text>
<text x="20" y="331" fill="#c9d1d9">Untracked files:</text>
<text x="20" y="350" fill="#c9d1d9">  (use "git add &lt;file&gt;..." to include in what will be committed)</text>
<text x="20" y="369" fill="#c9d1d9">        team03.tf</text>
</svg>
