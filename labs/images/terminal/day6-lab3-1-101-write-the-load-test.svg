<rect x="686" y="5" width="204" height="18" rx="9" fill="#d29922"/><text x="788" y="18" fill="#000" font-size="11" font-weight="bold" text-anchor="middle">EXAMPLE · DO NOT COPY</text>
<text x="450" y="19" fill="#8b949e" font-size="12" text-anchor="middle">Workspace terminal</text>
<text x="20" y="46"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> mkdir -p ~/day6 &amp;&amp; cd ~/day6</tspan></text>
<text x="20" y="65"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> cat &gt; load.js &lt;&lt;EOF</tspan></text>
<text x="20" y="84"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> import http from 'k6/http';</tspan></text>
<text x="20" y="103"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> import { check, sleep } from 'k6';</tspan></text>
<text x="20" y="122"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> </tspan></text>
<text x="20" y="141"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> export const options = { vus: 20, duration: '2m' };</tspan></text>
<text x="20" y="160"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> </tspan></text>
<text x="20" y="179"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> export default function () {</tspan></text>
<text x="20" y="198"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc">   const r = http.get('https://hello-$TEAM-staging.$DOMAIN/');</tspan></text>
<text x="20" y="217"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc">   check(r, { 'status is 200': (res) =&gt; res.status === 200 });</tspan></text>
<text x="20" y="236"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc">   sleep(0.5);</tspan></text>
<text x="20" y="255"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> }</tspan></text>
<text x="20" y="274"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> EOF</tspan></text>
<text x="20" y="293"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> cat load.js</tspan></text>
<text x="20" y="312" fill="#c9d1d9">  const r = http.get('https://hello-team03-staging.&lt;lab domain&gt;/');</text>
