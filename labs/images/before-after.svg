<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="A change before and after the platform" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>A change before and after the platform</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">Today: a change by tickets</text><rect x="20" y="45" width="120" height="60" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="80.0" y="71.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Ticket</text><text x="80.0" y="88.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">request a server</text><rect x="160" y="45" width="120" height="60" rx="8" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="220.0" y="71.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Queue</text><text x="220.0" y="88.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">wait 2 weeks</text><rect x="300" y="45" width="120" height="60" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="360.0" y="71.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Install</text><text x="360.0" y="88.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">by hand</text><rect x="440" y="45" width="120" height="60" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="500.0" y="71.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Checks</text><text x="500.0" y="88.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">by hand, varies</text><rect x="580" y="45" width="120" height="60" rx="8" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="640.0" y="71.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Sign-off</text><text x="640.0" y="88.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">weekly meeting</text><rect x="720" y="45" width="120" height="60" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="780.0" y="71.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Deploy</text><text x="780.0" y="88.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">ops logs in, Friday</text><rect x="860" y="45" width="120" height="60" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="920.0" y="71.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Live</text><text x="920.0" y="88.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">evidence later</text><polyline points="140,75 160,75" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><polyline points="280,75 300,75" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><polyline points="420,75 440,75" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><polyline points="560,75 580,75" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><polyline points="700,75 720,75" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><polyline points="840,75 860,75" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="20" y="135" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">Weeks from idea to live. Many hand-offs. Each check depends on who does it. Evidence is collected afterwards, for the audit.</text><text x="20" y="205" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">On the platform: the paved road</text><rect x="20" y="222" width="140" height="60" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="90.0" y="248.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Edit</text><text x="90.0" y="265.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">your branch</text><rect x="184" y="222" width="140" height="60" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="254.0" y="248.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Pull request</text><text x="254.0" y="265.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">one approval</text><rect x="348" y="222" width="140" height="60" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="418.0" y="248.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Pipeline</text><text x="418.0" y="265.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">test, scan, build</text><rect x="512" y="222" width="140" height="60" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="582.0" y="248.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Image</text><text x="582.0" y="265.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">scanned, signed</text><rect x="676" y="222" width="140" height="60" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="746.0" y="248.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Argo CD</text><text x="746.0" y="265.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">deploys from Git</text><rect x="840" y="222" width="140" height="60" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="910.0" y="248.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Live in dev</text><text x="910.0" y="265.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">evidence recorded</text><polyline points="160,252 184,252" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><polyline points="324,252 348,252" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><polyline points="488,252 512,252" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><polyline points="652,252 676,252" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><polyline points="816,252 840,252" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="20" y="312" font-size="11" font-weight="400" fill="#15803d" text-anchor="start">Minutes to hours. One review by a person; every other check is automatic and the same every time.</text><text x="20" y="326" font-size="11" font-weight="400" fill="#15803d" text-anchor="start">The evidence (who approved, which tests ran, what was deployed) is written as the change moves.</text><text x="20" y="365" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">Blue: what the platform does by itself. Red: where the old way waits.</text></svg>
