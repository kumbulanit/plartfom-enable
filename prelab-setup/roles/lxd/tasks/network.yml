---
- name: Read the LXD bridge settings
  ansible.builtin.command:
    argv: [lxc, network, get, "{{ pelab_lxd_bridge }}", "{{ item.key }}"]
  loop: "{{ lxd_bridge_config | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: lxd_bridge_current
  changed_when: false

- name: Apply LXD bridge settings that differ
  ansible.builtin.command:
    argv: [lxc, network, set, "{{ pelab_lxd_bridge }}", "{{ item.item.key }}", "{{ item.item.value }}"]
  loop: "{{ lxd_bridge_current.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when: item.stdout | trim != item.item.value | string
  changed_when: true

# A container lab host (pelab_container_host) has no udev, so the bridge never appears as a systemd
# device, and its resolver is Docker's: its lab names already resolve through public DNS, and
# nothing on the host needs the *.lxd names.
- name: Resolve container names and the lab domain on the host through the bridge
  ansible.builtin.template:
    src: pelab-lxd-dns.service.j2
    dest: /etc/systemd/system/pelab-lxd-dns.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart LXD bridge DNS
  when: not pelab_container_host | bool

- name: Enable bridge DNS on the host
  ansible.builtin.systemd_service:
    name: pelab-lxd-dns.service
    enabled: true
    state: started
    daemon_reload: true
  when: not pelab_container_host | bool
