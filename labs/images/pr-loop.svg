<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="The pull-request loop: main only takes a reviewed change with a green pipeline" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>The pull-request loop: main only takes a reviewed change with a green pipeline</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="60" width="150" height="60" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="95.0" y="86.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Your branch</text><text x="95.0" y="103.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">greeting-student01</text><rect x="230" y="60" width="150" height="60" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="305.0" y="86.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Pull request</text><text x="305.0" y="103.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">team01/hello</text><rect x="440" y="20" width="170" height="56" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="525.0" y="44.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Pipeline</text><text x="525.0" y="61.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">posts status "pipeline"</text><rect x="440" y="104" width="170" height="56" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="525.0" y="128.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Reviewer</text><text x="525.0" y="145.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">Review → Approve</text><rect x="680" y="60" width="130" height="60" rx="8" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="745.0" y="86.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Merge gate</text><text x="745.0" y="103.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">protected main</text><rect x="860" y="60" width="120" height="60" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="920.0" y="86.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">main</text><text x="920.0" y="103.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">squash commit</text><polyline points="170,90 230,90" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="200.0" y="83.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">git push</text><polyline points="380,75 440,48" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><polyline points="380,105 440,132" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><polyline points="610,48 680,78" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><polyline points="610,132 680,102" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="655" y="44" font-size="11" font-weight="400" fill="#2563eb" text-anchor="middle">green</text><text x="660" y="140" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">1 approval</text><polyline points="810,90 860,90" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#a-ok)"/><text x="835.0" y="83.0" font-size="11" font-weight="400" fill="#15803d" text-anchor="middle">merge</text><rect x="20" y="220" width="190" height="56" rx="8" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="115.0" y="244.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">git push to main</text><text x="115.0" y="261.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">refused</text><rect x="250" y="220" width="190" height="56" rx="8" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="345.0" y="244.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Approve your own PR</text><text x="345.0" y="261.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">refused</text><rect x="480" y="220" width="230" height="56" rx="8" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="595.0" y="244.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">New commit after approval</text><text x="595.0" y="261.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">approval dismissed</text><polyline points="115,220 115,180 745,180 745,120" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a-bad)"/><text x="430.0" y="173.0" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="middle">what Day 2 Lab 4 tries: each one stops at the gate</text><text x="760" y="240" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">After the merge, the pipeline on main</text><text x="760" y="254" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">pushes the image and Argo CD</text><text x="760" y="268" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">rolls it out to dev.</text></svg>
