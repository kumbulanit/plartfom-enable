<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" role="img" aria-label="One image, three environments: build once, change only the settings" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>One image, three environments: build once, change only the settings</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="110" width="140" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="90.0" y="138.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Dockerfile</text><text x="90.0" y="155.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">FROM python…</text><text x="90.0" y="170.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">USER 10001</text><rect x="220" y="110" width="150" height="64" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="295.0" y="138.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">docker build</text><text x="295.0" y="155.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">-t hello:1</text><rect x="430" y="110" width="140" height="64" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="500.0" y="138.0" font-size="13" font-