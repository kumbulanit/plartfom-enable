---
- name: Wait for the Gitea API
  ansible.builtin.uri:
    url: "{{ golden_path_gitea_api }}/version"
  register: golden_path_gitea_version
  retries: 30
  delay: 10
  until: golden_path_gitea_version.status == 200

# ---------------------------------------------------------------- accounts
- name: Check which Gitea accounts exist
  ansible.builtin.uri:
    url: "{{ golden_path_gitea_api }}/users/{{ item }}"
    status_code: [200, 404]
  loop: >-
    {{ [golden_path_bot_user, golden_path_applier_user] + pelab_workspace_names
       + ([pelab_platform_approver_user] if pelab_shared_logins | bool else []) }}
  register: golden_path_accounts

- name: Create the missing accounts (delegates sign in with their workspace password)
  ansible.builtin.uri:
    url: "{{ golden_path_gitea_api }}/admin/users"
    method: POST
    body:
      username: "{{ item }}"
      email: "{{ item }}@{{ pelab_domain }}"
      password: >-
        {{ {golden_path_bot_user: pelab_gitea_bot_password, golden_path_applier_user: pelab_gitea_applier_password,
            pelab_platform_approver_user: pelab_platform_approver_password}.get(item)
           or pelab_delegate_passwords[item] }}
      must_change_password: false
      visibility: limited
    status_code: [201]
  loop: "{{ golden_path_accounts.results | selectattr('status', 'equalto', 404) | map(attribute='item') | list }}"
  changed_when: true
  no_log: true

- name: Check for a saved token for {{ golden_path_bot_user }}
  ansible.builtin.stat:
    path: "{{ golden_path_bot_token_file }}"
  register: golden_path_bot_token_saved
  delegate_to: localhost
  become: false

- name: Create a read-only access token for {{ golden_path_bot_user }}
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - --namespace=gitea
      - exec
      - deploy/gitea
      - --container=gitea
      - --
      - gitea
      - admin
      - user
      - generate-access-token
      - --username={{ golden_path_bot_user }}
      - --token-name=platform-{{ now(utc=true, fmt='%Y%m%d%H%M%S') }}
      - --scopes=read:repository,read:organization,read:user
      - --raw
  register: golden_path_bot_token_new
  when: not golden_path_bot_token_saved.stat.exists
  changed_when: true
  no_log: true

- name: Save the token on the control node
  ansible.builtin.copy:
    content: "{{ golden_path_bot_token_new.stdout_lines | last }}\n"
    dest: "{{ golden_path_bot_token_file }}"
    mode: "0600"
  when: not golden_path_bot_token_saved.stat.exists
  delegate_to: localhost
  become: false
  no_log: true

- name: Load the token
  ansible.builtin.set_fact:
    golden_path_bot_token: "{{ lookup('ansible.builtin.file', golden_path_bot_token_file) }}"
  no_log: true

- name: Check for a saved token for {{ golden_path_applier_user }}
  ansible.builtin.stat:
    path: "{{ golden_path_applier_token_file }}"
  register: golden_path_applier_token_saved
  delegate_to: localhost
  become: false

# Write access is only for posting commit statuses ("platform/apply", and
# "safety-net/<env>" when the safety net is on). The account belongs to the
# platform organisation's "automation" team (the request repositories) and to
# each team organisation's "platform" team (read the services, post statuses).
- name: Create a token to clone and post commit statuses for {{ golden_path_applier_user }}
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - --namespace=gitea
      - exec
      - deploy/gitea
      - --container=gitea
      - --
      - gitea
      - admin
      - user
      - generate-access-token
      - --username={{ golden_path_applier_user }}
      - --token-name=applier-{{ now(utc=true, fmt='%Y%m%d%H%M%S') }}
      - --scopes=write:repository,read:organization
      - --raw
  register: golden_path_applier_token_new
  when: not golden_path_applier_token_saved.stat.exists
  changed_when: true
  no_log: true

- name: Save the applier token on the control node
  ansible.builtin.copy:
    content: "{{ golden_path_applier_token_new.stdout_lines | last }}\n"
    dest: "{{ golden_path_applier_token_file }}"
    mode: "0600"
  when: not golden_path_applier_token_saved.stat.exists
  delegate_to: localhost
  become: false
  no_log: true

# ------------------------------------------------------- organisations, teams
- name: Check which organisations exist
  ansible.builtin.uri:
    url: "{{ golden_path_gitea_api }}/orgs/{{ item }}"
    status_code: [200, 404]
  loop: "{{ [golden_path_platform_org] + pelab_team_names }}"
  register: golden_path_orgs

- name: Create the missing organisations (visible to signed-in users only)
  ansible.builtin.uri:
    url: "{{ golden_path_gitea_api }}/orgs"
    method: POST
    body:
      username: "{{ item }}"
      full_name: "{{ 'Platform team' if item == golden_path_platform_org else 'Team ' ~ item[-2:] }}"
      visibility: limited
    status_code: [201]
  loop: "{{ golden_path_orgs.results | selectattr('status', 'equalto', 404) | map(attribute='item') | list }}"
  changed_when: true

- name: List the teams of each team organisation
  ansible.builtin.uri:
    url: "{{ golden_path_gitea_api }}/orgs/{{ item }}/teams"
  loop: "{{ pelab_team_names }}"
  register: golden_path_org_teams

- name: Create a "developers" team with write access to all of the organisation's repositories
  ansible.builtin.uri:
    url: "{{ golden_path_gitea_api }}/orgs/{{ item.item }}/teams"
    method: POST
    body:
      name: developers
      description: Members of {{ item.item }}
      permission: write
      includes_all_repositories: true
      can_create_org_repo: true
      units: [repo.code, repo.issues, repo.pulls, repo.releases, repo.wiki, repo.actions, repo.projects, repo.packages]
    status_code: [201]
  loop: "{{ golden_path_org_teams.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: "'developers' not in item.json | map(attribute='name')"
  changed_when: true

- name: Create a "platform" team, so the platform applier can read the services and post deploy statuses
  ansible.builtin.uri:
    url: "{{ golden_path_gitea_api }}/orgs/{{ item.item }}/teams"
    method: POST
    body:
      name: platform
      description: "The platform applier: reads the services, and reports deployments while the safety net is on"
      permission: write
      includes_all_repositories: true
      can_create_org_repo: false
      units: [repo.code]
    status_code: [201]
  loop: "{{ golden_path_org_teams.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: "'platform' not in item.json | map(attribute='name')"
  changed_when: true

- name: List the teams again
  ansible.builtin.uri:
    url: "{{ golden_path_gitea_api }}/orgs/{{ item }}/teams"
  loop: "{{ pelab_team_names }}"
  register: golden_path_org_teams

- name: Add each delegate to their team's developers
  ansible.builtin.uri:
    url: >-
      {{ golden_path_gitea_api }}/teams/{{ (golden_path_org_teams.results | selectattr('item', 'equalto', item.value) | first).json
         | selectattr('name', 'equalto', 'developers') | map(attribute='id') | first }}/members/{{ item.key }}
    method: PUT
    status_code: [204]
  loop: "{{ pelab_workspace_teams | dict2items }}"
  loop_control:
    label: "{{ item.key }} -> {{ item.value }}"
  changed_when: false

- name: Add the platform applier to each team organisation's platform team
  ansible.builtin.uri:
    url: >-
      {{ golden_path_gitea_api }}/teams/{{ item.json | selectattr('name', 'equalto', 'platform') | map(attribute='id') | first
         }}/members/{{ golden_path_applier_user }}
    method: PUT
    status_code: [204]
  loop: "{{ golden_path_org_teams.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: false

# ------------------------------------------------------ pipeline settings
- name: Give each team organisation the Harbor push credentials, and the signing key if signing is on (Actions secrets)
  ansible.builtin.uri:
    url: "{{ golden_path_gitea_api }}/orgs/{{ item.0 }}/actions/secrets/{{ item.1.name }}"
    method: PUT
    body:
      data: "{{ item.1.value }}"
    status_code: [201, 204]
  loop: >-
    {{ pelab_team_names | product([{'name': 'HARBOR_USERNAME', 'value': golden_path_robot.name},
                                   {'name': 'HARBOR_PASSWORD', 'value': pelab_harbor_robot_secret}]
                                  + (golden_path_signing_secrets if golden_path_signing | bool else [])) | list }}
  changed_when: false
  no_log: true

- name: Tell the pipelines where the registry is (Actions variable REGISTRY)
  ansible.builtin.uri:
    url: "{{ golden_path_gitea_api }}/orgs/{{ item }}/actions/variables/REGISTRY"
    method: PUT
    body:
      value: "{{ pelab_hosts.harbor }}"
    status_code: [204, 404]
  loop: "{{ pelab_team_names }}"
  register: golden_path_registry_var
  changed_when: false

- name: Create the REGISTRY variable where it did not exist yet
  ansible.builtin.uri:
    url: "{{ golden_path_gitea_api }}/orgs/{{ item.item }}/actions/variables/REGISTRY"
    method: POST
    body:
      value: "{{ pelab_hosts.harbor }}"
    status_code: [201, 204]
  loop: "{{ golden_path_registry_var.results | selectattr('status', 'equalto', 404) | list }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true

# ------------------------- platform repositories (template, catalog, requests, handbook)
- name: Check for the platform repositories
  ansible.builtin.uri:
    url: "{{ golden_path_gitea_api }}/repos/{{ golden_path_platform_org }}/{{ item.name }}"
    status_code: [200, 404]
  loop: "{{ golden_path_platform_repos }}"
  loop_control:
    label: "{{ item.name }}"
  register: golden_path_platform_repo_check

- name: Create the missing platform repositories
  ansible.builtin.uri:
    url: "{{ golden_path_gitea_api }}/orgs/{{ golden_path_platform_org }}/repos"
    method: POST
    body:
      name: "{{ item.item.name }}"
      description: "{{ item.item.description }}"
      private: false
      template: "{{ item.item.template | default(false) }}"
      auto_init: true
      readme: Default
      default_branch: main
    status_code: [201]
  loop: "{{ golden_path_platform_repo_check.results | selectattr('status', 'equalto', 404) | list }}"
  loop_control:
    label: "{{ item.item.name }}"
  changed_when: true

# Only the request repositories run a pipeline (plan, tests); the others are not services.
- name: Set each platform repository's options (template flag, Actions)
  ansible.builtin.uri:
    url: "{{ golden_path_gitea_api }}/repos/{{ golden_path_platform_org }}/{{ item.name }}"
    method: PATCH
    body:
      has_actions: "{{ item.actions | default(false) }}"
      template: "{{ item.template | default(false) }}"
  loop: "{{ golden_path_platform_repos }}"
  loop_control:
    label: "{{ item.name }}"
  register: golden_path_platform_repo_info
  changed_when: false

- name: Remember the template's id (used for "Create from template" links)
  ansible.builtin.set_fact:
    golden_path_template_id: >-
      {{ (golden_path_platform_repo_info.results | selectattr('item.name', 'equalto', golden_path_template_repo) | first).json.id }}

- name: Collect each platform repository's files
  ansible.builtin.include_tasks: repo-files.yml
  loop: "{{ golden_path_platform_repos }}"
  loop_control:
    loop_var: golden_path_repo
    label: "{{ golden_path_repo.name }}"

- name: Add the guardrails to the policies repository, one file per policy
  ansible.builtin.set_fact:
    golden_path_repo_files: >-
      {{ golden_path_repo_files | combine({golden_path_policies_repo: golden_path_repo_files[golden_path_policies_repo]
           + [{'path': 'policies/' ~ item.metadata.name ~ '.yaml',
               'content': (golden_path_policy_header ~ item | ansible.builtin.to_nice_yaml(indent=2, width=100, sort_keys=False))
                          | b64encode}]}) }}
  vars:
    golden_path_policy_header: |
      # {{ item.metadata.annotations['policies.kyverno.io/title'] }}
      # Tests: tests/kyverno-test.yaml. The platform applies main within two minutes.
  loop: "{{ lookup('ansible.builtin.template', 'manifests/kyverno-policies.yaml.j2') | ansible.builtin.from_yaml_all | list }}"
  loop_control:
    label: "{{ item.metadata.name }}"

- name: Check whether the platform repositories have their content
  ansible.builtin.uri:
    url: "{{ golden_path_gitea_api }}/repos/{{ golden_path_platform_org }}/{{ item.name }}/contents/{{ item.marker }}"
    status_code: [200, 404]
  loop: "{{ golden_path_platform_repos }}"
  loop_control:
    label: "{{ item.name }}"
  register: golden_path_platform_repo_marker

- name: Read the README Gitea created with each new repository
  ansible.builtin.uri:
    url: "{{ golden_path_gitea_api }}/repos/{{ golden_path_platform_org }}/{{ item.item.name }}/contents/README.md"
  loop: "{{ golden_path_platform_repo_marker.results | selectattr('status', 'equalto', 404) | list }}"
  loop_control:
    label: "{{ item.item.name }}"
  register: golden_path_platform_readme

- name: Commit the content of the new platform repositories
  ansible.builtin.uri:
    url: "{{ golden_path_gitea_api }}/repos/{{ golden_path_platform_org }}/{{ item.item.item.name }}/contents"
    method: POST
    body:
      branch: main
      message: Add the PE Lab {{ item.item.item.name }} content
      files: >-
        {{ (golden_path_repo_files[item.item.item.name] | rejectattr('path', 'equalto', 'README.md')
            | map('combine', {'operation': 'create'}) | list)
           + (golden_path_repo_files[item.item.item.name] | selectattr('path', 'equalto', 'README.md')
              | map('combine', {'operation': 'update', 'sha': item.json.sha}) | list) }}
    status_code: [201]
  loop: "{{ golden_path_platform_readme.results }}"
  loop_control:
    label: "{{ item.item.item.name }}"
  changed_when: true

# New services copy this rule when "Protected branches" is ticked on "Create from template".
- name: Protect main on the template (pull requests only, one approval, a green pipeline)
  ansible.builtin.include_tasks: protect.yml
  vars:
    golden_path_protect_repos: ["{{ golden_path_platform_org }}/{{ golden_path_template_repo }}"]
    golden_path_protect_rule: "{{ golden_path_branch_protection }}"

# ------------------------------------- request repositories (environments, policies)
- name: List the platform organisation's teams
  ansible.builtin.uri:
    url: "{{ golden_path_gitea_api }}/orgs/{{ golden_path_platform_org }}/teams"
  register: golden_path_platform_teams

# requesters: every delegate may branch and open pull requests (not approve them).
# automation: the platform applier, which reads main and posts commit statuses.
# approvers: the shared platform-approver account; it reads and reviews only, and
# main's approvals list makes its approval count.
- name: Create the platform teams for the request repositories
  ansible.builtin.uri:
    url: "{{ golden_path_gitea_api }}/orgs/{{ golden_path_platform_org }}/teams"
    method: POST
    body:
      name: "{{ item.name }}"
      description: "{{ item.description }}"
      permission: "{{ item.permission | default('write') }}"
      includes_all_repositories: false
      can_create_org_repo: false
      units: [repo.code, repo.pulls, repo.actions]
    status_code: [201]
  loop:
    - {name: requesters, description: "Delegates: pull requests to the request repositories"}
    - {name: automation, description: The platform applier}
    - {name: approvers, description: "The platform team's role for delegates: reviews only", permission: read}
  when: item.name not in golden_path_platform_teams.json | map(attribute='name')
  changed_when: true

- name: List the platform organisation's teams again
  ansible.builtin.uri:
    url: "{{ golden_path_gitea_api }}/orgs/{{ golden_path_platform_org }}/teams"
  register: golden_path_platform_teams

- name: Give the three teams the request repositories
  ansible.builtin.uri:
    url: >-
      {{ golden_path_gitea_api }}/teams/{{ golden_path_platform_teams.json | selectattr('name', 'equalto', item.0) | map(attribute='id') | first
      }}/repos/{{ golden_path_platform_org }}/{{ item.1 }}
    method: PUT
    status_code: [204]
  loop: "{{ ['requesters', 'automation', 'approvers'] | product(golden_path_request_repos) | list }}"
  changed_when: false

- name: Add the delegates to requesters, the applier to automation and the shared approver to approvers
  ansible.builtin.uri:
    url: >-
      {{ golden_path_gitea_api }}/teams/{{ golden_path_platform_teams.json | selectattr('name', 'equalto', item.0) | map(attribute='id') | first
      }}/members/{{ item.1 }}
    method: PUT
    status_code: [204]
  loop: >-
    {{ (['requesters'] | product(pelab_workspace_names) | list) + [['automation', golden_path_applier_user]]
       + ([['approvers', pelab_platform_approver_user]] if pelab_shared_logins | bool else []) }}
  loop_control:
    label: "{{ item.1 }} -> {{ item.0 }}"
  changed_when: false

- name: Protect main on the request repositories (pull requests only, approved by the platform team)
  ansible.builtin.include_tasks: protect.yml
  vars:
    golden_path_protect_repos: "{{ golden_path_request_repos | map('regex_replace', '^', golden_path_platform_org ~ '/') | list }}"
    golden_path_protect_rule: "{{ golden_path_request_protection }}"

- name: Read the plan pipeline's read-only token
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ golden_path_tfstate_namespace }}"
    name: environments-reader-token
  register: golden_path_reader_token
  until: golden_path_reader_token.resources | length > 0 and golden_path_reader_token.resources[0].data.token is defined
  retries: 10
  delay: 3
  no_log: true

- name: Give the environments pipeline its read-only cluster access (Actions secret)
  ansible.builtin.uri:
    url: >-
      {{ golden_path_gitea_api }}/repos/{{ golden_path_platform_org }}/{{ golden_path_environments_repo
      }}/actions/secrets/ENVIRONMENTS_READER_KUBECONFIG
    method: PUT
    body:
      data: "{{ lookup('ansible.builtin.template', 'environments-reader-kubeconfig.yaml.j2') }}"
    status_code: [201, 204]
  changed_when: false
  no_log: true

# ------------------------------------------------------ team starter services
- name: Check for each team's starter service
  ansible.builtin.uri:
    url: "{{ golden_path_gitea_api }}/repos/{{ item }}/{{ golden_path_starter_repo }}"
    status_code: [200, 404]
  loop: "{{ pelab_team_names }}"
  register: golden_path_starters

- name: Create each team's starter service from the template
  ansible.builtin.uri:
    url: "{{ golden_path_gitea_api }}/repos/{{ golden_path_platform_org }}/{{ golden_path_template_repo }}/generate"
    method: POST
    body:
      owner: "{{ item.item }}"
      name: "{{ golden_path_starter_repo }}"
      description: "{{ item.item }}'s first service, created from the golden path"
      private: false
      git_content: true
      protected_branch: true
      topics: true
      labels: true
    status_code: [201]
  loop: "{{ golden_path_starters.results | selectattr('status', 'equalto', 404) | list }}"
  loop_control:
    label: "{{ item.item }}/{{ golden_path_starter_repo }}"
  register: golden_path_starters_created
  changed_when: true

- name: Protect main on each starter service (pull requests only, one approval, a green pipeline)
  ansible.builtin.include_tasks: protect.yml
  vars:
    golden_path_protect_repos: "{{ pelab_team_names | map('regex_replace', '$', '/' ~ golden_path_starter_repo) | list }}"
    golden_path_protect_rule: "{{ golden_path_branch_protection }}"

- name: Run the pipeline once on each new starter service
  ansible.builtin.uri:
    url: "{{ golden_path_gitea_api }}/repos/{{ item.item.item }}/{{ golden_path_starter_repo }}/actions/workflows/ci.yaml/dispatches"
    method: POST
    body:
      ref: main
    status_code: [204]
  loop: "{{ golden_path_starters_created.results | selectattr('changed') | list }}"
  loop_control:
    label: "{{ item.item.item }}/{{ golden_path_starter_repo }}"
  when: golden_path_build_starters | bool
  changed_when: true
