<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Two incidents, two ways back: Argo CD self-heals drift; Git reverts a bad release" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>Two incidents, two ways back: Argo CD self-heals drift; Git reverts a bad release</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="30" font-size="13" font-weight="600" fill="#1f2933" text-anchor="start">A change by hand</text><rect x="20" y="45" width="200" height="56" rx="8" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="120.0" y="69.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">kubectl scale … --replicas=0</text><text x="120.0" y="86.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">dev: 0 copies, 503</text><rect x="300" y="45" width="180" height="56" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="390.0" y="69.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Argo CD</text><text x="390.0" y="86.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">OutOfSync: Git says 1</text><rect x="560" y="45" width="170" height="56" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="645.0" y="69.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Self-heal</text><text x="645.0" y="86.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">no human</text><rect x="810" y="45" width="170" height="56" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="895.0" y="69.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">dev: 1/1</text><text x="895.0" y="86.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">about a minute</text><polyline points="220,73 300,73" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="260.0" y="66.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">drift</text><polyline points="480,73 560,73" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><polyline points="730,73 810,73" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="20" y="170" font-size="13" font-weight="600" fill="#1f2933" text-anchor="start">A bad release</text><rect x="20" y="185" width="200" height="56" rx="8" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="120.0" y="209.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Release PR</text><text x="120.0" y="226.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">newTag: does-not-exist</text><rect x="300" y="185" width="180" height="56" rx="8" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="390.0" y="209.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">staging</text><text x="390.0" y="226.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">new pod ImagePullBackOff</text><rect x="560" y="185" width="170" height="56" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="645.0" y="209.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">git revert</text><text x="645.0" y="226.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">a reviewed PR</text><rect x="810" y="185" width="170" height="56" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="895.0" y="209.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">staging healthy</text><text x="895.0" y="226.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">old tag again</text><polyline points="220,213 300,213" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="260.0" y="206.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">merged</text><polyline points="480,213 560,213" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><polyline points="730,213 810,213" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="770.0" y="206.0" font-size="11" font-weight="400" fill="#2563eb" text-anchor="middle">syncs</text><text x="300" y="280" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">The old pod keeps serving while the new one fails: users see no outage.</text></svg>
