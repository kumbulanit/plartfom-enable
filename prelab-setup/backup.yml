---
# Takes a backup now and copies it to the control node, so the course can be
# restored on another server if the lab host fails (see the README).
#
#   ansible-playbook backup.yml                        # back up now, then copy
#   ansible-playbook backup.yml -e backup_run_now=false  # copy the latest nightly one

- name: Back up the lab and copy the backup to the control node
  hosts: pelab
  become: true
  gather_facts: false
  vars:
    backup_run_now: true
  tasks:
    - name: Load the backup settings
      ansible.builtin.include_vars: roles/backup/defaults/main.yml

    - name: Take a backup now
      ansible.builtin.systemd_service:
        name: pelab-backup.service
        state: started
      when: backup_run_now | bool
      changed_when: true

    - name: Find the latest backup
      ansible.builtin.find:
        paths: "{{ backup_dir }}"
        file_type: directory
        patterns: "20*"
        excludes: "*.partial"
      register: backup_found

    - name: Stop when there is no backup yet
      ansible.builtin.assert:
        that: backup_found.files | length > 0
        fail_msg: No backup in {{ backup_dir }} yet. Run without -e backup_run_now=false.

    - name: Choose the latest backup
      ansible.builtin.set_fact:
        backup_latest: "{{ (backup_found.files | sort(attribute='path') | last).path }}"

    - name: Make the folder for it on the control node
      ansible.builtin.file:
        path: "{{ backup_local_dir }}/{{ inventory_hostname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    # rsync over SSH, reading on the host with sudo: backups can be many GB.
    - name: Copy it to the control node
      ansible.posix.synchronize:
        mode: pull
        src: "{{ backup_latest }}"
        dest: "{{ backup_local_dir }}/{{ inventory_hostname }}/"
        rsync_path: sudo rsync
      become: false

    - name: Check the copy against its checksums
      ansible.builtin.shell:
        cmd: if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi
        chdir: "{{ backup_local_dir }}/{{ inventory_hostname }}/{{ backup_latest | basename }}"
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Say where it is
      ansible.builtin.debug:
        msg: "Backup copied to {{ backup_local_dir }}/{{ inventory_hostname }}/{{ backup_latest | basename }}"
