---
- name: Upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: dist
    autoremove: true
  when: host_base_upgrade | bool

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ host_base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check whether a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: host_base_reboot_flag

- name: Reboot to finish patching
  ansible.builtin.reboot:
    msg: Rebooting to finish patching (pe-lab-ansible)
    reboot_timeout: 900
  when:
    - host_base_reboot_flag.stat.exists
    - host_base_allow_reboot | bool
