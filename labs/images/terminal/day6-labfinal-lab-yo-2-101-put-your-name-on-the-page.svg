<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 615" width="900" height="615" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve" style="background:#000;border-radius:10px">
<rect width="900" height="615" rx="10" fill="#000"/>
<rect width="900" height="28" rx="10" fill="#21262d"/><rect y="18" width="900" height="10" fill="#21262d"/>
<circle cx="20" cy="14" r="6" fill="#ff5f56"/><circle cx="40" cy="14" r="6" fill="#ffbd2e"/><circle cx="60" cy="14" r="6" fill="#27c93f"/>
<rect x="686" y="5" width="204" height="18" rx="9" fill="#d29922"/><text x="788" y="18" fill="#000" font-size="11" font-weight="bold" text-anchor="middle">EXAMPLE · DO NOT COPY</text>
<text x="450" y="19" fill="#8b949e" font-size="12" text-anchor="middle">Workspace terminal</text>
<text x="20" y="46"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> cd ~/hello</tspan></text>
<text x="20" y="65"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> git switch main &amp;&amp; git pull</tspan></text>
<text x="20" y="84"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> git switch -c congrats-$ME</tspan></text>
<text x="20" y="103"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> mkdir -p app/graduates</tspan></text>
<text x="20" y="122"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> echo "$NAME" &gt; app/graduates/$ME.txt</tspan></text>
<text x="20" y="141"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> python3 - &lt;&lt;'EOF'</tspan></text>
<text x="20" y="160"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> from pathlib import Path</tspan></text>
<text x="20" y="179"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> </tspan></text>
<text x="20" y="198"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> main = Path("app/main.py")</tspan></text>
<text x="20" y="217"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> code = main.read_text()</tspan></text>
<text x="20" y="236"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> if "def congrats()" in code:</tspan></text>
<text x="20" y="255"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc">     print("The party is already on the page (you ran this before). Only your name is updated."</tspan></text>
<text x="20" y="274" fill="#f0f6fc">)</text>
<text x="20" y="293"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> else:</tspan></text>
<text x="20" y="312"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc">     block = r'''</tspan></text>
<text x="20" y="331"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> # The end of the course: the names in app/graduates/ (one file each), and what they did.</tspan></text>
<text x="20" y="350"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> WEEK = [</tspan></text>
<text x="20" y="369"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc">     ("🐧", "Linux and Git: every change by pull request, with a review"),</tspan></text>
<text x="20" y="388"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc">     ("🏗️", "Infrastructure as code: environments asked for in OpenTofu"),</tspan></text>
<text x="20" y="407"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc">     ("📦", "Containers, and a new service from the golden path template"),</tspan></text>
<text x="20" y="426"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc">     ("🛡️", "A pipeline that tests and scans, and guardrails in the cluster"),</tspan></text>
<text x="20" y="445"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc">     ("🚀", "Releases to dev, staging and prod with GitOps, watched in Grafana"),</tspan></text>
<text x="20" y="464"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> ]</tspan></text>
<text x="20" y="483"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> PARTY = """&lt;style&gt;</tspan></text>
<text x="20" y="502"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc">   .env { animation: party-glow 2.4s ease-in-out infinite; }</tspan></text>
<text x="20" y="521"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc">   .env, .message, .facts, .party { position: relative; z-index: 1; }</tspan></text>
<text x="20" y="540"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc">   .party { display: flex; flex-direction: column; align-items: center; gap: 1rem; }</tspan></text>
<text x="20" y="559"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc">   .party-trophy { font-size: 4.5rem; animation: party-bounce 1.6s ease-in-out infinite; }</tspan></text>
<text x="20" y="578" fill="#c9d1d9">...</text>
</svg>
