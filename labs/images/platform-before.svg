<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="Before platform engineering: every team does everything" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>Before platform engineering: every team does everything</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="34" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="start">Before: every team does everything</text><line x1="115" y1="106" x2="69" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="115" y1="106" x2="157" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="115" y1="106" x2="245" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="115" y1="106" x2="333" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="115" y1="106" x2="421" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="115" y1="106" x2="509" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="290" y1="106" x2="69" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="290" y1="106" x2="157" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="290" y1="106" x2="245" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="290" y1="106" x2="333" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="290" y1="106" x2="421" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="290" y1="106" x2="509" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="465" y1="106" x2="69" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="465" y1="106" x2="157" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="465" y1="106" x2="245" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="465" y1="106" x2="333" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="465" y1="106" x2="421" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="465" y1="106" x2="509" y2="260" stroke="#7b8794" stroke-width="1"/><rect x="40" y="60" width="150" height="46" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="115.0" y="88.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Team A</text><rect x="215" y="60" width="150" height="46" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="290.0" y="88.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Team B</text><rect x="390" y="60" width="150" height="46" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="465.0" y="88.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Team C</text><rect x="30" y="260" width="78" height="36" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="69.0" y="283.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Git</text><rect x="118" y="260" width="78" height="36" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="157.0" y="283.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Pipeline</text><rect x="206" y="260" width="78" height="36" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="245.0" y="283.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Scanner</text><rect x="294" y="260" width="78" height="36" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="333.0" y="283.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Registry</text><rect x="382" y="260" width="78" height="36" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="421.0" y="283.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Cluster</text><rect x="470" y="260" width="78" height="36" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="509.0" y="283.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Monitoring</text><text x="290" y="318" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">3 teams × 6 tools = 18 set-ups, each a little different</text><rect x="40" y="330" width="500" height="46" rx="8" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="290.0" y="349.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Ops team: a queue of tickets</text><text x="290.0" y="366.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">servers, access, firewall: days to weeks each</text><polyline points="40,83 26,83 26,353 40,353" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a-bad)"/><text x="640" y="34" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="start">What it costs</text><rect x="640" y="60" width="340" height="58" rx="8" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="810.0" y="85.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Slow</text><text x="810.0" y="102.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">weeks from idea to live</text><rect x="640" y="130" width="340" height="58" rx="8" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="810.0" y="155.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Risky</text><text x="810.0" y="172.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">checks depend on who does them</text><rect x="640" y="200" width="340" height="58" rx="8" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="810.0" y="225.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Inconsistent</text><text x="810.0" y="242.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">every team a little different</text><rect x="640" y="270" width="340" height="58" rx="8" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="810.0" y="295.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Overloaded</text><text x="810.0" y="312.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">every team learns every tool</text><rect x="640" y="340" width="340" height="58" rx="8" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="810.0" y="365.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Audit pain</text><text x="810.0" y="382.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">evidence gathered afterwards</text></svg>
