<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Guardrails: Kyverno checks every Pod at the API server, whoever applies it" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>Guardrails: Kyverno checks every Pod at the API server, whoever applies it</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="110" width="150" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="95.0" y="138.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">kubectl apply</text><text x="95.0" y="155.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">or Argo CD</text><rect x="230" y="110" width="150" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="305.0" y="138.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">API server</text><text x="305.0" y="155.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">k3s</text><rect x="440" y="50" width="260" height="184" rx="8" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="570.0" y="147.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle"></text><text x="570" y="76" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Kyverno: three policies</text><rect x="460" y="90" width="220" height="38" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="570.0" y="114.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">trusted registry</text><text x="570" y="123" font-size="10" font-weight="400" fill="#616e7c" text-anchor="middle">image from harbor.&lt;domain&gt;</text><rect x="460" y="136" width="220" height="38" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="570.0" y="160.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">immutable tags</text><text x="570" y="169" font-size="10" font-weight="400" fill="#616e7c" text-anchor="middle">no :latest</text><rect x="460" y="182" width="220" height="38" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="570.0" y="206.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">ownership labels</text><text x="570" y="215" font-size="10" font-weight="400" fill="#616e7c" text-anchor="middle">name, part-of</text><rect x="780" y="50" width="200" height="64" rx="8" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="880.0" y="78.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Refused</text><text x="880.0" y="95.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">each message names the fix</text><rect x="780" y="170" width="200" height="64" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="880.0" y="198.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Running</text><text x="880.0" y="215.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">in teamNN-dev</text><polyline points="170,142 230,142" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="200.0" y="135.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">create Pod</text><polyline points="380,142 440,142" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="410.0" y="135.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">admission</text><polyline points="700,100 780,82" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#a-bad)"/><polyline points="700,190 780,202" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#a-ok)"/><text x="740" y="128" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="middle">any rule fails</text><text x="740" y="168" font-size="11" font-weight="400" fill="#15803d" text-anchor="middle">all pass</text><rect x="230" y="230" width="190" height="56" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="325.0" y="254.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">pelab-exceptions</text><text x="325.0" y="271.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">approved, until a date</text><polyline points="420,258 570,258 570,234" fill="none" stroke="#7b8794" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-n)"/><text x="495.0" y="274.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">lets one workload through</text></svg>
