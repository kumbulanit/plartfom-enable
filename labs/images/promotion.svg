<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Promotion: dev follows main; staging and prod change only through an approved release pull request" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>Promotion: dev follows main; staging and prod change only through an approved release pull request</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="40" width="170" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="105.0" y="68.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">merge to main</text><text x="105.0" y="85.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">pipeline pushes &lt;sha&gt;</text><rect x="20" y="190" width="170" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="105.0" y="218.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Release PR</text><text x="105.0" y="235.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">two lines · approved</text><rect x="260" y="40" width="190" height="64" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="355.0" y="68.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">deploy/dev</text><text x="355.0" y="85.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">newTag: &lt;latest sha&gt;</text><rect x="260" y="140" width="190" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="355.0" y="168.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">deploy/staging</text><text x="355.0" y="185.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">newTag: TAG · count: 1</text><rect x="260" y="240" width="190" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="355.0" y="268.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">deploy/prod</text><text x="355.0" y="285.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">newTag: TAG · count: 2</text><polyline points="190,72 260,72" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="225.0" y="65.0" font-size="11" font-weight="400" fill="#2563eb" text-anchor="middle">automatic</text><polyline points="190,212 260,172" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><polyline points="190,232 260,272" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="225" y="235" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">changes</text><rect x="540" y="120" width="150" height="104" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="615.0" y="168.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Argo CD</text><text x="615.0" y="185.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">makes the cluster</text><text x="615.0" y="200.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">match Git</text><polyline points="450,72 540,140" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><polyline points="450,172 540,172" fill="none" stroke=