<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 724" width="1200" height="724" role="img" aria-label="Platform engineering: where it was, where it is now, and where it can go" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>Platform engineering: where it was, where it is now, and where it can go</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><line x1="584" y1="20" x2="584" y2="490" stroke="#e4e7eb" stroke-width="1.5"/><text x="20" y="34" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="start">1  Where it was: every team does everything</text><line x1="115" y1="106" x2="69" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="115" y1="106" x2="157" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="115" y1="106" x2="245" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="115" y1="106" x2="333" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="115" y1="106" x2="421" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="115" y1="106" x2="509" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="290" y1="106" x2="69" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="290" y1="106" x2="157" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="290" y1="106" x2="245" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="290" y1="106" x2="333" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="290" y1="106" x2="421" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="290" y1="106" x2="509" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="465" y1="106" x2="69" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="465" y1="106" x2="157" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="465" y1="106" x2="245" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="465" y1="106" x2="333" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="465" y1="106" x2="421" y2="260" stroke="#7b8794" stroke-width="1"/><line x1="465" y1="106" x2="509" y2="260" stroke="#7b8794" stroke-width="1"/><rect x="40" y="60" width="150" height="46" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="115.0" y="88.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Team A</text><rect x="215" y="60" width="150" height="46" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="290.0" y="88.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Team B</text><rect x="390" y="60" width="150" height="46" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="465.0" y="88.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Team C</text><rect x="30" y="260" width="78" height="36" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="69.0" y="283.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Git</text><rect x="118" y="260" width="78" height="36" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="157.0" y="283.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Pipeline</text><rect x="206" y="260" width="78" height="36" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="245.0" y="283.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Scanner</text><rect x="294" y="260" width="78" height="36" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="333.0" y="283.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Registry</text><rect x="382" y="260" width="78" height="36" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="421.0" y="283.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Cluster</text><rect x="470" y="260" width="78" height="36" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="509.0" y="283.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Monitoring</text><text x="290" y="318" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">3 teams × 6 tools = 18 set-ups, each a little different</text><rect x="40" y="330" width="500" height="46" rx="8" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="290.0" y="349.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Ops team: a queue of tickets</text><text x="290.0" y="366.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">servers, access, firewall: days to weeks each</text><polyline points="40,83 26,83 26,353 40,353" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a-bad)"/><text x="20" y="410" font-size="12" font-weight="400" fill="#b91c1c" text-anchor="start">Every team learns and wires every tool itself.</text><text x="20" y="424" font-size="12" font-weight="400" fill="#b91c1c" text-anchor="start">Work waits in ticket queues.</text><text x="20" y="438" font-size="12" font-weight="400" fill="#b91c1c" text-anchor="start">Security checks and audit evidence differ from team to team.</text><text x="604" y="34" font-size="15" font-weight="700" fill="#2563eb" text-anchor="start">2  Where it is now: one paved road for every team</text><rect x="620" y="60" width="120" height="46" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="680.0" y="88.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Team A</text><polyline points="680,106 680,130" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><rect x="760" y="60" width="120" height="46" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="820.0" y="88.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Team B</text><polyline points="820,106 820,130" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><rect x="900" y="60" width="120" height="46" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="960.0" y="88.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Team C</text><polyline points="960,106 960,130" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><rect x="620" y="130" width="400" height="50" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="820.0" y="151.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Self-service</text><text x="820.0" y="168.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">the portal, templates, and a pull request: no tickets</text><polyline points="820,180 820,205" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><rect x="620" y="205" width="400" height="153" rx="10" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="820" y="224" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Internal developer platform</text><text x="820" y="240" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">golden paths, with guardrails built in</text><rect x="630" y="250" width="120" height="44" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="690.0" y="268.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Code, review</text><text x="690.0" y="285.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">Gitea</text><rect x="760" y="250" width="120" height="44" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="820.0" y="268.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Pipeline</text><text x="820.0" y="285.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">Gitea Actions</text><rect x="890" y="250" width="120" height="44" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="950.0" y="268.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Images, scans</text><text x="950.0" y="285.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">Harbor</text><rect x="630" y="302" width="120" height="44" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="690.0" y="320.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Environments</text><text x="690.0" y="337.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">OpenTofu</text><rect x="760" y="302" width="120" height="44" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="820.0" y="320.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Deploy</text><text x="820.0" y="337.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">Argo CD</text><rect x="890" y="302" width="120" height="44" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="950.0" y="320.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Observe</text><text x="950.0" y="337.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">Grafana</text><rect x="620" y="372" width="400" height="36" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="5 4"/><text x="820.0" y="395.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Infrastructure: Kubernetes, servers, network</text><rect x="1040" y="230" width="140" height="100" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="1110.0" y="276.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Platform team</text><text x="1110.0" y="293.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">builds and runs it</text><text x="1110.0" y="308.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">as a product:</text><text x="1110.0" y="323.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">users, a roadmap</text><polyline points="1040,280 1020,280" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#a-ok)"/><polyline points="1020,83 1110,83 1110,230" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a-ok)"/><text x="1118.0" y="160.5" font-size="11" font-weight="400" fill="#15803d" text-anchor="start">feedback</text><text x="604" y="432" font-size="12" font-weight="400" fill="#2563eb" text-anchor="start">Teams use one way in; the platform team wires the tools once.</text><text x="604" y="446" font-size="12" font-weight="400" fill="#2563eb" text-anchor="start">The safe way is the easy way: the checks run by themselves,</text><text x="604" y="460" font-size="12" font-weight="400" fill="#2563eb" text-anchor="start">the same for every team, and leave evidence behind.</text><text x="20" y="520" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">What it gives the bank</text><rect x="20" y="536" width="220" height="58" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="130.0" y="561.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Faster</text><text x="130.0" y="578.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">minutes, not weeks</text><rect x="252" y="536" width="220" height="58" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="362.0" y="561.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Safer</text><text x="362.0" y="578.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">guardrails by default</text><rect x="484" y="536" width="220" height="58" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="594.0" y="561.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Consistent</text><text x="594.0" y="578.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">one path for every team</text><rect x="716" y="536" width="220" height="58" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="826.0" y="561.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Less to learn</text><text x="826.0" y="578.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">teams focus on their product</text><rect x="948" y="536" width="220" height="58" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="1058.0" y="561.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Audit-ready</text><text x="1058.0" y="578.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">evidence on every change</text><text x="20" y="636" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">3  Where it can go next: the same road, more of it built</text><rect x="20" y="650" width="220" height="58" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="5 4"/><text x="130.0" y="675.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Single sign-on</text><text x="130.0" y="692.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">one login, tied to the directory</text><rect x="252" y="650" width="220" height="58" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="5 4"/><text x="362.0" y="675.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Signed images</text><text x="362.0" y="692.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">only signed images may run</text><rect x="484" y="650" width="220" height="58" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="5 4"/><text x="594.0" y="675.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Canary releases</text><text x="594.0" y="692.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">10% of users first, then all</text><rect x="716" y="650" width="220" height="58" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="5 4"/><text x="826.0" y="675.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">APIs and events</text><text x="826.0" y="692.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">a gateway and an event stream</text><rect x="948" y="650" width="220" height="58" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1058.0" y="675.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Cost per team</text><text x="1058.0" y="692.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">the budget, shown in money</text></svg>
