<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-label="The pipeline on every change: each step can stop it, and its last step posts the verdict" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>The pipeline on every change: each step can stop it, and its last step posts the verdict</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="15" y="50" width="105" height="56" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="67.5" y="74.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">ruff</text><text x="67.5" y="91.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">lint</text><rect x="137" y="50" width="105" height="56" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="189.5" y="74.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">pytest</text><text x="189.5" y="91.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">unit tests</text><polyline points="120,78 137,78" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><rect x="259" y="50" width="105" height="56" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="311.5" y="74.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">gitleaks</text><text x="311.5" y="91.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">secrets</text><polyline points="242,78 259,78" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><rect x="381" y="50" width="105" height="56" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="433.5" y="74.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">hadolint</text><text x="433.5" y="91.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">Dockerfile</text><polyline points="364,78 381,78" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><rect x="503" y="50" width="105" height="56" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="555.5" y="74.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">kustomize</text><text x="555.5" y="91.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">deploy files</text><polyline points="486,78 503,78" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><rect x="625" y="50" width="105" height="56" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="677.5" y="74.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">docker build</text><text x="677.5" y="91.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">image</text><polyline points="608,78 625,78" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><rect x="747" y="50" width="105" height="56" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="799.5" y="74.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">trivy</text><text x="799.5" y="91.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">scan</text><polyline points="730,78 747,78" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><rect x="869" y="50" width="105" height="56" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="921.5" y="74.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">push</text><text x="921.5" y="91.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">main only</text><polyline points="852,78 869,78" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><rect x="400" y="175" width="220" height="56" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="510.0" y="199.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">status "pipeline"</text><text x="510.0" y="216.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">success or failure</text><polyline points="67,106 67,128 920,128 920,106" fill="none" stroke="#15803d" stroke-width="1.5"/><polyline points="510,128 510,175" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#a-ok)"/><text x="518.0" y="155.5" font-size="11" font-weight="400" fill="#15803d" text-anchor="start">last step: always runs, even after a failure</text><text x="189" y="30" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="middle">Day 5: wrong test</text><text x="311" y="30" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="middle">Day 5: password</text><text x="433" y="30" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="middle">Day 5: USER root</text><text x="660" y="190" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">The merge gate reads this status:</text><text x="660" y="204" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">red, and main refuses the merge.</text></svg>
