<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Where a change lives: the four places, and the command that moves it" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>Where a change lives: the four places, and the command that moves it</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="50" width="195" height="76" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="117.5" y="84.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Working folder</text><text x="117.5" y="101.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">the files you edit</text><text x="117.5" y="116.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">~/hello</text><rect x="275" y="50" width="195" height="76" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="372.5" y="84.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Staging area</text><text x="372.5" y="101.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">what goes into</text><text x="372.5" y="116.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">the next commit</text><rect x="530" y="50" width="195" height="76" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="627.5" y="84.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Your repository</text><text x="627.5" y="101.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">every commit, in</text><text x="627.5" y="116.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">~/hello/.git</text><rect x="785" y="50" width="195" height="76" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="882.5" y="84.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Gitea</text><text x="882.5" y="101.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">the shared copy (origin)</text><text x="882.5" y="116.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">team01/hello</text><polyline points="215,78 275,78" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="245.0" y="71.0" font-size="11" font-weight="400" fill="#2563eb" text-anchor="middle">git add</text><polyline points="470,78 530,78" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="500.0" y="71.0" font-size="11" font-weight="400" fill="#2563eb" text-anchor="middle">git commit</text><polyline points="725,78 785,78" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="755.0" y="71.0" font-size="11" font-weight="400" fill="#2563eb" text-anchor="middle">git push</text><polyline points="882,126 882,175 117,175 117,126" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#a-ok)"/><text x="499.5" y="191.0" font-size="11" font-weight="400" fill="#15803d" text-anchor="middle">git pull: fetch what others merged, and update your files</text><text x="117" y="34" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">on your workspace</text><text x="627" y="34" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">on your workspace</text><text x="882" y="34" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">on the server</text><text x="20" y="235" font-size="12" font-weight="400" fill="#616e7c" text-anchor="start">git status tells you which place each changed file is in: "Untracked" or "Changes not staged" (working folder),</text><text x="20" y="249" font-size="12" font-weight="400" fill="#616e7c" text-anchor="start">"Changes to be committed" (staging area), "Your branch is ahead of origin/main by 1 commit" (committed, not pushed).</text><text x="20" y="263" font-size="12" font-weight="400" fill="#616e7c" text-anchor="start">Nothing leaves your workspace until you push; nothing others did reaches you until you pull.</text></svg>
