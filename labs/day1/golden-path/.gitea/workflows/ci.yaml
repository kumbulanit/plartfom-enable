# Golden-path pipeline. Every change is linted, tested and scanned; changes
# merged to main are built into an image and pushed to Harbor, and Argo CD then
# deploys that image to the team's dev namespace.
#
# Provided by the platform for every team organisation:
#   vars.REGISTRY            the lab's Harbor, e.g. harbor.<domain>
#   secrets.HARBOR_USERNAME  a robot account that may push to your team's project
#   secrets.HARBOR_PASSWORD
# and, only when the platform team has turned on image signing:
#   secrets.COSIGN_PRIVATE_KEY  the platform's signing key (encrypted)
#   secrets.COSIGN_PASSWORD     its password
name: golden-path

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # The lab runners have the same tools as your workspace (ruff, pytest, gitleaks, ...).
    runs-on: pelab-host
    env:
      IMAGE: ${{ vars.REGISTRY }}/${{ gitea.repository }}:${{ gitea.sha }}
    steps:
      - name: Check out
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: token ${{ gitea.token }}" \
            fetch -q --depth 1 "${{ gitea.server_url }}/${{ gitea.repository }}.git" "${{ gitea.ref }}"
          git checkout -q FETCH_HEAD
          git log -1 --format='Building %h: %s'

      - name: Lint (ruff)
        run: ruff check . && ruff format --check .

      - name: Unit tests (pytest)
        run: pytest -q -p no:cacheprovider

      - name: Secret scan (gitleaks)
        # --verbose names the rule, file and line of each finding (the value stays REDACTED).
        run: gitleaks git --no-banner --redact --verbose .

      - name: Dockerfile lint (hadolint)
        run: hadolint Dockerfile

      - name: Validate the manifests (kustomize)
        run: for env in dev staging prod; do kubectl kustomize "deploy/$env" > /dev/null; done

      - name: Build the image
        run: |
          docker build \
            --build-arg BASE_IMAGE="${{ vars.REGISTRY }}/dockerhub/library/python:3.12-slim" \
            --build-arg APP_VERSION="${{ gitea.sha }}" \
            --tag "${IMAGE,,}" .

      # Report only: Harbor scans the image again on push and keeps its SBOM.
      - name: Vulnerability scan (trivy)
        continue-on-error: true
        run: trivy image --no-progress --severity HIGH,CRITICAL --ignore-unfixed "${IMAGE,,}"

      - name: Push to Harbor
        if: gitea.event_name != 'pull_request'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          echo "$HARBOR_PASSWORD" | docker login "${{ vars.REGISTRY }}" -u "$HARBOR_USERNAME" --password-stdin
          docker push "${IMAGE,,}"
          echo "Pushed ${IMAGE,,}. Argo CD deploys it to dev within a minute or two."

      # Skipped unless the platform provides a signing key. Signs the image Harbor
      # now holds, by digest, so the signature covers exactly those bytes; Kyverno
      # checks it in your namespaces. The lab may have no internet access, so
      # nothing goes to a public transparency log: cosign 3 needs both flags for that.
      - name: Sign the image (cosign)
        if: gitea.event_name != 'pull_request' && secrets.COSIGN_PRIVATE_KEY != ''
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          echo "$HARBOR_PASSWORD" | docker login "${{ vars.REGISTRY }}" -u "$HARBOR_USERNAME" --password-stdin
          SIGNED="$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE,,}")"
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            --use-signing-config=false --tlog-upload=false "$SIGNED"
          echo "Signed $SIGNED"

      - name: Clean up
        if: always()
        run: docker image rm "${IMAGE,,}" > /dev/null 2>&1 || true

      # The merge gate. The pipeline posts its own verdict on the commit, as the
      # "pipeline" status; main is protected so that a red one cannot be merged.
      # (Gitea 1.27.0 cannot require the statuses its jobs write: see the README.)
      - name: Post the verdict (the required check for merging)
        if: always()
        run: |
          case "${{ job.status }}" in
            success) STATE=success; TEXT="Lint, tests, scans and build passed" ;;
            *)       STATE=failure; TEXT="A step failed: open this run and read it" ;;
          esac
          curl -fsS -o /dev/null -X POST \
            -H "Authorization: token ${{ gitea.token }}" -H "Content-Type: application/json" \
            "${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}/statuses/${{ gitea.event.pull_request.head.sha || gitea.sha }}" \
            -d "{\"context\": \"pipeline\", \"state\": \"$STATE\", \"description\": \"$TEXT\", \"target_url\": \"${{ gitea.server_url }}/${{ gitea.repository }}/actions/runs/${{ gitea.run_number }}\"}"
          echo "pipeline: $STATE"
