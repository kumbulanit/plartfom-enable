<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 197" width="900" height="197" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve" style="background:#000;border-radius:10px">
<rect width="900" height="197" rx="10" fill="#000"/>
<rect width="900" height="28" rx="10" fill="#21262d"/><rect y="18" width="900" height="10" fill="#21262d"/>
<circle cx="20" cy="14" r="6" fill="#ff5f56"/><circle cx="40" cy="14" r="6" fill="#ffbd2e"/><circle cx="60" cy="14" r="6" fill="#27c93f"/>
<rect x="686" y="5" width="204" height="18" rx="9" fill="#d29922"/><text x="788" y="18" fill="#000" font-size="11" font-weight="bold" text-anchor="middle">EXAMPLE · DO NOT COPY</text>
<text x="450" y="19" fill="#8b949e" font-size="12" text-anchor="middle">Workspace terminal: type this</text>
<text x="20" y="46"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> cd ~/hello</tspan></text>
<text x="20" y="65"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> git switch main &amp;&amp; git pull</tspan></text>
<text x="20" y="84"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> TAG=$(git rev-parse HEAD)</tspan></text>
<text x="20" y="103"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> git switch -c congrats-staging-$ME</tspan></text>
<text x="20" y="122"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> sed -i "s/newTag: .*/newTag: $TAG/; s/count: 0/count: 1/" deploy/staging/kustomization.yaml</tspan></text>
<text x="20" y="141"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> git commit -am "Release the congratulations to staging"</tspan></text>
<text x="20" y="160"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> git push -u origin congrats-staging-$ME</tspan></text>
</svg>
