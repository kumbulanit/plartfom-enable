<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="A value stream, mapped: where the time goes" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>A value stream, mapped: where the time goes</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="12" y="50" width="112" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="68.0" y="87.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Ticket raised</text><text x="68" y="138" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">work 0.1 day</text><rect x="152" y="50" width="112" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="208.0" y="87.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Triage</text><text x="208" y="138" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">work 0.1 day</text><rect x="292" y="50" width="112" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="348.0" y="87.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Write the SQL</text><text x="348" y="138" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">work 1 day</text><rect x="432" y="50" width="112" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="488.0" y="87.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Peer check</text><text x="488" y="138" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">work 0.3 day</text><rect x="572" y="50" width="112" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="628.0" y="87.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Approval</text><text x="628" y="138" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">work 0.2 day</text><rect x="712" y="50" width="112" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="768.0" y="87.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Ops runs it</text><text x="768" y="138" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">work 0.3 day</text><rect x="852" y="50" width="112" height="64" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="908.0" y="87.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Live</text><polyline points="124,82 152,82" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="138" y="40" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">wait 5 d</text><polyline points="264,82 292,82" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="278" y="40" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">wait 3 d</text><polyline points="404,82 432,82" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="418" y="40" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">wait 2 d</text><polyline points="544,82 572,82" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="558" y="40" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">wait 4 d</text><polyline points="684,82 712,82" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="698" y="40" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">wait 3 d</text><polyline points="824,82 852,82" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="838" y="40" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">wait 1 d</text><text x="20" y="200" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">Lead time: 20 days</text><rect x="20" y="215" width="810.0" height="34" rx="4" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><rect x="830.0" y="215" width="90.0" height="34" rx="4" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="425" y="237" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">18 days waiting</text><text x="875" y="237" font-size="12" font-weight="600" fill="#15803d" text-anchor="middle">2 days</text><text x="20" y="285" font-size="12" font-weight="400" fill="#616e7c" text-anchor="start">Flow efficiency = work time / lead time = 2 / 20 = 10%.</text><text x="20" y="299" font-size="12" font-weight="400" fill="#616e7c" text-anchor="start">Making people work faster saves little; removing the waits between them saves most.</text><text x="20" y="313" font-size="12" font-weight="400" fill="#616e7c" text-anchor="start">An example, not a measurement: Lab 1 maps one of your own changes the same way.</text></svg>
