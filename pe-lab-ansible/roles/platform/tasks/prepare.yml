---
- name: Wait for the Kubernetes API
  kubernetes.core.k8s_cluster_info:
  register: platform_cluster_info
  retries: 20
  delay: 10
  until: platform_cluster_info is succeeded

- name: Create the platform namespaces
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ item }}"
        labels:
          pelab.io/tier: platform
  loop: "{{ platform_namespaces }}"

- name: Read the lab certificate, key and CA
  ansible.builtin.slurp:
    src: "{{ pelab_tls_dir }}/{{ item }}"
  loop: [tls.crt, tls.key, ca.crt]
  register: platform_tls_files
  no_log: true

- name: Keep the lab CA for chart values
  ansible.builtin.set_fact:
    platform_ca_pem: "{{ platform_tls_files.results[2].content | b64decode }}"

- name: Install the wildcard TLS secret in each namespace
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      type: kubernetes.io/tls
      metadata:
        name: "{{ pelab_tls_secret_name }}"
        namespace: "{{ item }}"
      data:
        tls.crt: "{{ platform_tls_files.results[0].content }}"
        tls.key: "{{ platform_tls_files.results[1].content }}"
  loop: "{{ ['kube-system'] + platform_namespaces }}"
  no_log: true

- name: Publish the lab CA in each namespace
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: pelab-ca
        namespace: "{{ item }}"
      data:
        ca.crt: "{{ platform_ca_pem }}"
  loop: "{{ platform_namespaces }}"

- name: Create admin credential secrets
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: "{{ item.name }}"
        namespace: "{{ item.namespace }}"
      stringData: "{{ item.data }}"
  # Only for the releases that are installed (extras create their namespace when enabled).
  loop: "{{ platform_admin_secrets | selectattr('release', 'in', platform_enabled_names) | list }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.name }}"
  no_log: true
