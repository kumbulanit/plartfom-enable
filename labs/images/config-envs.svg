<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="One code, three environments: only the settings change" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>One code, three environments: only the settings change</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="120" width="200" height="76" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="120.0" y="154.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">One build of hello</text><text x="120.0" y="171.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">the same code (Day 4:</text><text x="120.0" y="186.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">the same image)</text><rect x="420" y="20" width="160" height="70" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="500.0" y="60.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">dev</text><polyline points="220,158 300,158 300,55 420,55" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="610" y="48" font-size="12" font-weight="400" fill="#616e7c" text-anchor="start">APP_ENV=dev</text><text x="610" y="62" font-size="12" font-weight="400" fill="#616e7c" text-anchor="start">GREETING="Hello from dev"</text><rect x="420" y="120" width="160" height="70" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="500.0" y="160.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">staging</text><polyline points="220,158 300,158 300,155 420,155" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="610" y="148" font-size="12" font-weight="400" fill="#616e7c" text-anchor="start">APP_ENV=staging</text><text x="610" y="162" font-size="12" font-weight="400" fill="#616e7c" text-anchor="start">GREETING="Hello from staging"</text><rect x="420" y="220" width="160" height="70" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="500.0" y="260.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">prod</text><polyline points="220,158 300,158 300,255 420,255" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="610" y="248" font-size="12" font-weight="400" fill="#616e7c" text-anchor="start">APP_ENV=prod</text><text x="610" y="262" font-size="12" font-weight="400" fill="#616e7c" text-anchor="start">GREETING="Hello from prod"</text><text x="20" y="318" font-size="12" font-weight="400" fill="#616e7c" text-anchor="start">Settings come from outside the code (environment variables). What was tested in staging is exactly what runs in prod:</text><text x="20" y="332" font-size="12" font-weight="400" fill="#616e7c" text-anchor="start">only the settings differ. Lab 3 does this by hand today.</text></svg>
