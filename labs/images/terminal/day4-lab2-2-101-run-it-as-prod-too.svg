<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 235" width="900" height="235" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve" style="background:#000;border-radius:10px">
<rect width="900" height="235" rx="10" fill="#000"/>
<rect width="900" height="28" rx="10" fill="#21262d"/><rect y="18" width="900" height="10" fill="#21262d"/>
<circle cx="20" cy="14" r="6" fill="#ff5f56"/><circle cx="40" cy="14" r="6" fill="#ffbd2e"/><circle cx="60" cy="14" r="6" fill="#27c93f"/>
<rect x="686" y="5" width="204" height="18" rx="9" fill="#d29922"/><text x="788" y="18" fill="#000" font-size="11" font-weight="bold" text-anchor="middle">EXAMPLE · DO NOT COPY</text>
<text x="450" y="19" fill="#8b949e" font-size="12" text-anchor="middle">Workspace terminal</text>
<text x="20" y="46"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> docker run -d --name hello-prod -p 8083:8081 -e APP_ENV=prod -e GREETING="Hello from prod" hel</tspan></text>
<text x="20" y="65" fill="#f0f6fc">lo:1</text>
<text x="20" y="84"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> sleep 2</tspan></text>
<text x="20" y="103"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> curl -s localhost:8083/</tspan></text>
<text x="20" y="122"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> docker ps</tspan></text>
<text x="20" y="141" fill="#c9d1d9">{"app": "hello", "version": "dev", "environment": "prod", "message": "Hello from prod"}</text>
<text x="20" y="160" fill="#c9d1d9">CONTAINER ID   IMAGE     ...   PORTS                    NAMES</text>
<text x="20" y="179" fill="#c9d1d9">...            hello:1   ...   0.0.0.0:8083-&gt;8081/tcp   hello-prod</text>
<text x="20" y="198" fill="#c9d1d9">...            hello:1   ...   0.0.0.0:8082-&gt;8081/tcp   hello-staging</text>
</svg>
