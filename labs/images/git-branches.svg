<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-label="A branch is a label on a commit; HEAD is where you are" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>A branch is a label on a commit; HEAD is where you are</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="30" font-size="12" font-weight="400" fill="#616e7c" text-anchor="start">Each commit points back to the one before it: the history is a chain.</text><text x="40" y="44" font-size="12" font-weight="400" fill="#616e7c" text-anchor="start">A branch is only a name that points at the newest commit of its line, and moves forward when you commit.</text><text x="40" y="58" font-size="12" font-weight="400" fill="#616e7c" text-anchor="start">git switch moves HEAD (you) from one branch to another, and changes your files to match.</text><rect x="40" y="200" width="170" height="56" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="125.0" y="224.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">e448d09</text><text x="125.0" y="241.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">Initial commit</text><rect x="250" y="200" width="170" height="56" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="335.0" y="224.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">b70e47f</text><text x="335.0" y="241.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">Change the greeting (#1)</text><polyline points="250,228 210,228" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><rect x="480" y="110" width="160" height="56" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="560.0" y="134.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">91ab3f0</text><text x="560.0" y="151.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">your commit</text><rect x="690" y="110" width="160" height="56" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="770.0" y="134.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">d37e6c2</text><text x="770.0" y="151.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">your next commit</text><polyline points="480,138 335,138 335,200" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><polyline points="690,138 640,138" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><rect x="265" y="290" width="140" height="38" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="335.0" y="314.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">main</text><polyline points="335,290 335,256" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#a-ok)"/><rect x="680" y="210" width="180" height="38" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="770.0" y="234.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">greeting-student01</text><polyline points="770,210 770,166" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><rect x="890" y="210" width="90" height="38" rx="8" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="935.0" y="234.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">HEAD</text><polyline points="890,229 860,229" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#a-bad)"/><text x="450" y="290" font-size="12" font-weight="400" fill="#616e7c" text-anchor="start">main stays where it is until a reviewed pull request is merged.</text><text x="450" y="304" font-size="12" font-weight="400" fill="#616e7c" text-anchor="start">Your branch moves on with every commit you make on it.</text></svg>
