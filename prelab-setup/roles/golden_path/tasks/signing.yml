---
# Only with golden_path_signing. One cosign key pair for the lab: the pipelines
# sign with the private key (an organisation Actions secret, see gitea.yml) and
# Kyverno verifies with the public key (see the policies). The pair is generated
# once, on a runner because the runners have cosign, and kept in credentials/.

- name: Create the credentials folder on the control node
  ansible.builtin.file:
    path: "{{ pelab_credentials_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Check for the signing key on the control node
  ansible.builtin.stat:
    path: "{{ golden_path_cosign_pub_file }}"
  register: golden_path_cosign_saved
  delegate_to: localhost
  become: false

# The password arrives on stdin, so it never appears in a process list. The
# private key is printed encrypted with it, followed by the public key.
- name: Generate the signing key pair on {{ pelab_runner_names[0] }}
  ansible.builtin.command:
    argv:
      - lxc
      - exec
      - "{{ pelab_runner_names[0] }}"
      - --
      - sh
      - -c
      - >-
        set -e; dir=$(mktemp -d); trap 'rm -rf "$dir"' EXIT; cd "$dir";
        read -r COSIGN_PASSWORD; export COSIGN_PASSWORD;
        cosign generate-key-pair >&2; cat cosign.key cosign.pub
    stdin: "{{ pelab_cosign_password }}"
  register: golden_path_cosign_generated
  when: not golden_path_cosign_saved.stat.exists
  changed_when: true
  no_log: true

# The public key is written last: the check above treats it as "the pair is saved".
- name: Save the key pair on the control node
  ansible.builtin.copy:
    content: "{{ golden_path_cosign_generated.stdout | regex_search(item.pem) }}\n"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - dest: "{{ golden_path_cosign_key_file }}"
      mode: "0600"
      pem: (?s)-----BEGIN ENCRYPTED SIGSTORE PRIVATE KEY-----.*-----END ENCRYPTED SIGSTORE PRIVATE KEY-----
    - dest: "{{ golden_path_cosign_pub_file }}"
      mode: "0644"
      pem: (?s)-----BEGIN PUBLIC KEY-----.*-----END PUBLIC KEY-----
  loop_control:
    label: "{{ item.dest }}"
  when: not golden_path_cosign_saved.stat.exists
  delegate_to: localhost
  become: false
  no_log: true
