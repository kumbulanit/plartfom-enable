---
# Each delegate builds the lab on their own VM: Ansible runs on the VM itself
# (localhost), so the VM's passwords are written on that VM only, in
# credentials/pelab01/, and nobody else's passwords are there.
# Every VM uses this same file unchanged.
all:
  children:
    pelab:
      hosts:
        pelab01:
          ansible_connection: local
          # The VM's own address, for its certificate and SSH. If the VM has more
          # than one network, replace this with the address the delegate uses.
          ansible_host: "{{ ansible_facts['default_ipv4']['address'] | default('127.0.0.1') }}"
