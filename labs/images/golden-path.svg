<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="The golden path: from a commit to prod, and who does each step" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>The golden path: from a commit to prod, and who does each step</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="40" width="135" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="87.5" y="68.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Edit</text><text x="87.5" y="85.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">your workspace</text><rect x="185" y="40" width="135" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="252.5" y="68.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Pull request</text><text x="252.5" y="85.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">Gitea · 1 approval</text><rect x="350" y="40" width="135" height="64" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="417.5" y="68.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Pipeline</text><text x="417.5" y="85.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">Gitea Actions</text><rect x="515" y="40" width="135" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="582.5" y="68.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Image</text><text x="582.5" y="85.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">Harbor · scan, SBOM</text><rect x="680" y="40" width="135" height="64" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="747.5" y="68.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Argo CD</text><text x="747.5" y="85.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">deploys what Git says</text><rect x="845" y="40" width="135" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="912.5" y="68.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">dev · staging · prod</text><text x="912.5" y="85.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">k3s namespaces</text><polyline points="155,72 185,72" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="170" y="130" font-size="11" font-weight="400" fill="#2563eb" text-anchor="middle">push</text><polyline points="320,72 350,72" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="335" y="130" font-size="11" font-weight="400" fill="#2563eb" text-anchor="middle">merge</text><polyline points="485,72 515,72" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="500" y="130" font-size="11" font-weight="400" fill="#2563eb" text-anchor="middle">push</text><polyline points="650,72 680,72" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="665" y="130" font-size="11" font-weight="400" fill="#2563eb" text-anchor="middle">watch</text><polyline points="815,72 845,72" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="830" y="130" font-size="11" font-weight="400" fill="#2563eb" text-anchor="middle">sync</text><rect x="680" y="160" width="135" height="56" rx="8" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="747.5" y="184.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Kyverno</text><text x="747.5" y="201.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">checks every Pod</text><polyline points="747,160 747,104" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a-bad)"/><text x="755.0" y="136.0" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">refuses bad</text><text x="755.0" y="149.0" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">images</text><rect x="845" y="160" width="135" height="56" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="912.5" y="184.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Grafana</text><text x="912.5" y="201.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">versions, traffic, logs</text><polyline points="912,104 912,160" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><rect x="185" y="160" width="135" height="56" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="5 4"/><text x="252.5" y="184.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Backstage</text><text x="252.5" y="201.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">who owns what</text><text x="20" y="250" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">Blue: what the platform does by itself once a change is approved. You only edit, open the pull request and approve;</text><text x="20" y="264" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">dev follows main automatically, and staging and prod follow a two-line release pull request (Day 6).</text></svg>
