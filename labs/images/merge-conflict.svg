<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="A merge conflict: two branches changed the same line" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>A merge conflict: two branches changed the same line</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="120" width="120" height="50" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="80.0" y="141.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">main</text><text x="80.0" y="158.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">GREETING = …</text><rect x="220" y="40" width="170" height="56" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="305.0" y="64.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">conflict-a</text><text x="305.0" y="81.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">"Hello from A"</text><rect x="220" y="200" width="170" height="56" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="305.0" y="224.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">conflict-b</text><text x="305.0" y="241.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">"Hello from B"</text><polyline points="140,135 220,68" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="188.0" y="105.5" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">branch</text><polyline points="140,155 220,228" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="188.0" y="195.5" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">branch</text><rect x="470" y="40" width="150" height="56" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="545.0" y="64.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">main</text><text x="545.0" y="81.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">has A (merged first)</text><polyline points="390,68 470,68" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#a-ok)"/><text x="430.0" y="61.0" font-size="11" font-weight="400" fill="#15803d" text-anchor="middle">merge</text><rect x="470" y="200" width="190" height="56" rx="8" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="565.0" y="224.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">git merge main</text><text x="565.0" y="241.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">CONFLICT in app/main.py</text><polyline points="390,228 470,228" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><polyline points="545,96 545,200" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="553.0" y="152.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">bring main in</text><rect x="720" y="200" width="160" height="56" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="800.0" y="224.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">You choose</text><text x="800.0" y="241.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">one line, no markers</text><polyline points="660,228 720,228" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="690.0" y="221.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">edit</text><text x="720" y="120" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text><text x="720" y="134" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">"Hello from B"</text><text x="720" y="148" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">=======</text><text x="720" y="162" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">"Hello from A"</text><text x="720" y="176" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">&gt;&gt;&gt;&gt;&gt;&gt;&gt; main</text></svg>
