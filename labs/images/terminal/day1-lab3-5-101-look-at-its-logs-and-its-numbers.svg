<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 254" width="900" height="254" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve">
<rect width="900" height="254" rx="10" fill="#0d1117"/>
<rect width="900" height="28" rx="10" fill="#21262d"/><rect y="18" width="900" height="10" fill="#21262d"/>
<circle cx="20" cy="14" r="6" fill="#ff5f56"/><circle cx="40" cy="14" r="6" fill="#ffbd2e"/><circle cx="60" cy="14" r="6" fill="#27c93f"/>
<text x="450" y="19" fill="#8b949e" font-size="12" text-anchor="middle">Workspace terminal</text>
<text x="20" y="46"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> curl -s localhost:8082/metrics</tspan></text>
<text x="20" y="65" fill="#c9d1d9"># HELP http_requests_total HTTP requests handled, by path and status code.</text>
<text x="20" y="84" fill="#c9d1d9"># TYPE http_requests_total counter</text>
<text x="20" y="103" fill="#c9d1d9">http_requests_total{path="/",status="200"} 1</text>
<text x="20" y="122" fill="#c9d1d9"># HELP app_info The running version of the service.</text>
<text x="20" y="141" fill="#c9d1d9"># TYPE app_info gauge</text>
<text x="20" y="160" fill="#c9d1d9">app_info{app="hello",version="dev",env="staging"} 1</text>
<text x="20" y="179" fill="#c9d1d9"># HELP app_uptime_seconds Seconds since the service started.</text>
<text x="20" y="198" fill="#c9d1d9"># TYPE app_uptime_seconds gauge</text>
<text x="20" y="217" fill="#c9d1d9">app_uptime_seconds 74</text>
</svg>
