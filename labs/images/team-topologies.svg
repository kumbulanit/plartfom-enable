<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="How the teams work together" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>How the teams work together</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="40" width="210" height="62" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="125.0" y="67.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Market operations team</text><text x="125.0" y="84.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">stream-aligned</text><rect x="260" y="40" width="210" height="62" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="365.0" y="67.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Reserves team</text><text x="365.0" y="84.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">stream-aligned</text><rect x="500" y="40" width="210" height="62" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="605.0" y="67.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Analytics team</text><text x="605.0" y="84.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">stream-aligned</text><rect x="20" y="270" width="690" height="66" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="365.0" y="299.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Platform team</text><text x="365.0" y="316.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">builds and runs the paved road as a product: environments, pipelines, deployment, monitoring</text><polyline points="125,270 125,102" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><text x="133.0" y="190.0" font-size="11" font-weight="400" fill="#2563eb" text-anchor="start">self-service</text><text x="133.0" y="203.0" font-size="11" font-weight="400" fill="#2563eb" text-anchor="start">(as a service)</text><polyline points="365,270 365,102" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><polyline points="605,270 605,102" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><rect x="780" y="40" width="200" height="62" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="880.0" y="67.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Enabling team</text><text x="880.0" y="84.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">security, testing coaches</text><polyline points="780,71 710,71" fill="none" stroke="#7b8794" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-n)"/><text x="745" y="128" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">coaching,</text><text x="745" y="142" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">for a while</text><rect x="780" y="180" width="200" height="62" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="5 4"/><text x="880.0" y="207.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Complicated subsystem</text><text x="880.0" y="224.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">e.g. a pricing engine</text><polyline points="780,211 650,211 650,102" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a-n)"/><text x="715.0" y="204.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">used as a service</text><text x="780" y="290" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">Stream-aligned teams deliver to</text><text x="780" y="304" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">users. The others exist to make</text><text x="780" y="318" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">them faster, mostly by</text><text x="780" y="332" font-size="11" font-weight="400" fill="#616e7c" text-anchor="start">self-service, not tickets.</text></svg>
