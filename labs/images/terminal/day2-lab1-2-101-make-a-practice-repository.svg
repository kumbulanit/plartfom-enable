<text x="450" y="19" fill="#8b949e" font-size="12" text-anchor="middle">Workspace terminal</text>
<text x="20" y="46"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> mkdir -p ~/git-practice &amp;&amp; cd ~/git-practice</tspan></text>
