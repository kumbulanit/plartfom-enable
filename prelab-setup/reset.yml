---
# Reset between cohorts (or between course days):
#  - every workspace goes back to its "clean" snapshot,
#  - team namespaces are deleted and dev is recreated empty; the platform
#    applier recreates the staging and prod environments the teams requested
#    (platform/environments), and Argo CD redeploys every team service from Git
#    (GitOps puts it all back),
#  - runner Docker caches are pruned,
#  - with reset_rotate_credentials=true (new cohort): new keys and tokens (the
#    passwords stay: they are fixed in files/passwords/); the teams' Gitea organisations, repositories, accounts, Harbor
#    images and logins are deleted and recreated fresh from the golden path; and
#    the cohort's environment and exception requests are removed.
#
#   ansible-playbook reset.yml                                   # same cohort
#   ansible-playbook reset.yml -e reset_rotate_credentials=true  # new cohort

- name: Refuse to run from the checks-only inventory
  ansible.builtin.import_playbook: checks-only-guard.yml

- name: Reset the lab
  hosts: pelab
  become: true
  gather_facts: false
  vars:
    reset_rotate_credentials: false
    reset_prune_runners: true
  environment:
    KUBECONFIG: "{{ pelab_kubeconfig }}"
    K8S_AUTH_KUBECONFIG: "{{ pelab_kubeconfig }}"
  pre_tasks:
    - name: Use the virtualenv that has the Kubernetes client
      ansible.builtin.set_fact:
        ansible_python_interpreter: "{{ pelab_venv }}/bin/python"

  tasks:
    - name: Pause the platform applier while the lab is reset
      ansible.builtin.systemd_service:
        name: pelab-platform-apply.timer
        state: stopped
      failed_when: false

    - name: Stop the workspaces
      ansible.builtin.command:
        argv: "{{ ['lxc', 'stop', '--force'] + pelab_workspace_names }}"
      register: reset_stop
      changed_when: true
      failed_when:
        - reset_stop.rc != 0
        - "'already stopped' not in reset_stop.stderr"

    - name: Restore each workspace to its clean snapshot
      ansible.builtin.command:
        argv: [lxc, restore, "{{ item }}", "{{ pelab_workspace_snapshot }}"]
      loop: "{{ pelab_workspace_names }}"
      changed_when: true

    - name: Rotate delegate credentials for a new cohort
      when: reset_rotate_credentials | bool
      block:
        # The passwords stay: they are fixed in files/passwords/ (edit them there).
        - name: Remove generated keys and logins on the control node
          ansible.builtin.file:
            path: "{{ pelab_credentials_dir }}/{{ item }}"
            state: absent
          loop: [ssh, logins, workspaces.csv]
          delegate_to: localhost
          become: false

        - name: Remove the teams' Gitea organisations, repositories, accounts and images
          ansible.builtin.include_role:
            name: golden_path
            tasks_from: cleanup.yml

        - name: Forget the cohort's environment state (OpenTofu) and approved exceptions
          kubernetes.core.k8s:
            state: absent
            api_version: "{{ item.api_version }}"
            kind: "{{ item.kind }}"
            namespace: "{{ item.namespace }}"
            label_selectors: "{{ item.selectors }}"
            delete_all: true
          loop:
            - {api_version: v1, kind: Secret, namespace: pelab-tfstate, selectors: [tfstate=true]}
            - {api_version: kyverno.io/v2, kind: PolicyException, namespace: "{{ pelab_exception_namespace }}",
               selectors: [app.kubernetes.io/managed-by=pelab-platform-apply]}
          loop_control:
            label: "{{ item.kind }} in {{ item.namespace }}"

        - name: Forget the applier's copies of the old repositories
          ansible.builtin.file:
            path: "{{ pelab_state_dir }}/applier/{{ item }}"
            state: absent
          loop: [repos, services, last-status.json]

        - name: Delete the delegates' Kubernetes tokens
          kubernetes.core.k8s:
            state: absent
            api_version: v1
            kind: Secret
            namespace: pelab-users
            label_selectors: [pelab.io/token=delegate]
            delete_all: true
            wait: true

    - name: Start the workspaces and reapply their configuration
      ansible.builtin.include_role:
        name: workspaces

    - name: Delete the team namespaces
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Namespace
        label_selectors: [pelab.io/tier=team]
        delete_all: true
        wait: true
        wait_timeout: 900

    - name: Recreate the team namespaces and kubeconfigs
      ansible.builtin.include_role:
        name: teams

    - name: Reapply the golden path (recreates team content after a rotation)
      ansible.builtin.include_role:
        name: golden_path

    - name: Prune Docker images, containers and volumes on the runners
      ansible.builtin.command:
        argv: [lxc, exec, "{{ item }}", --, docker, system, prune, --all, --volumes, --force]
      loop: "{{ pelab_runner_names }}"
      when: reset_prune_runners | bool
      changed_when: true
