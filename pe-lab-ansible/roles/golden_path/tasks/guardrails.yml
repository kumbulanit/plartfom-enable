---
- name: Enforce the platform guardrails in team namespaces (Kyverno)
  kubernetes.core.k8s:
    state: present
    apply: true
    definition: "{{ lookup('ansible.builtin.template', 'manifests/kyverno-policies.yaml.j2') | ansible.builtin.from_yaml_all | list }}"

- name: Publish the golden-path dashboard in Grafana
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: pelab-golden-path-dashboard
        namespace: monitoring
        labels:
          grafana_dashboard: "1"
        annotations:
          grafana_folder: PE Lab
      data:
        golden-path.json: "{{ lookup('ansible.builtin.file', 'grafana-golden-path.json') }}"
