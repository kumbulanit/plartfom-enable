---
- name: Wait for the delegate tokens
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ teams_users_namespace }}"
    label_selector: pelab.io/token=delegate
  register: teams_tokens
  retries: 12
  delay: 5
  until: >-
    teams_tokens.resources | selectattr('data.token', 'defined') | list | length
    == pelab_workspace_names | length
  no_log: true

- name: Read the container UID map base
  ansible.builtin.command:
    argv: [lxc, config, get, "{{ pelab_workspace_names[0] }}", volatile.idmap.base]
  register: teams_idmap_base
  changed_when: false

- name: Write the kubeconfig mounted at /etc/pelab/kubeconfig
  ansible.builtin.template:
    src: kubeconfig.yaml.j2
    dest: "{{ pelab_workspaces_host_dir }}/{{ item }}/kubeconfig"
    owner: "{{ teams_idmap_base.stdout | int + pelab_workspace_uid | int }}"
    group: "{{ teams_idmap_base.stdout | int + pelab_workspace_uid | int }}"
    mode: "0600"
  vars:
    teams_token: "{{ teams_tokens.resources | selectattr('metadata.name', 'equalto', item ~ '-token') | first }}"
    teams_team: "{{ pelab_workspace_teams[item] | default('') }}"
  loop: "{{ pelab_workspace_names }}"
  no_log: true
