---
# The delivery safety net, for when Argo CD gives trouble during the course.
#
#   ansible-playbook safety-net.yml -e safety_net=on    Argo CD is paused; the platform deploys the teams' services
#   ansible-playbook safety-net.yml -e safety_net=off   Argo CD deploys them again
#   ansible-playbook safety-net.yml                     which of the two is deploying now
#
# Nothing running is removed either way, and teams keep working the same way:
# pull requests, approvals, the same pipelines. While it is on, each commit shows
# the result as the status "safety-net/<env>". See docs/instructor/safety-net.md.

- name: Refuse to run from the checks-only inventory
  ansible.builtin.import_playbook: checks-only-guard.yml

- name: Switch the delivery safety net
  hosts: pelab
  become: true
  gather_facts: false
  vars:
    safety_net: status
    # -e safety_net=on arrives as text; in a vars file `on` would be a boolean.
    safety_net_action: "{{ {'true': 'on', 'false': 'off'}.get(safety_net | string | lower, safety_net | string | lower) }}"
  tasks:
    - name: Check the request
      ansible.builtin.assert:
        that: safety_net_action in ['on', 'off', 'status']
        fail_msg: Use -e safety_net=on or -e safety_net=off, or leave it out to see which is deploying.
        quiet: true

    - name: Switch the safety net {{ safety_net_action }}
      ansible.builtin.command:
        argv: [/usr/local/sbin/pelab-safety-net, "{{ safety_net_action }}"]
      register: safety_net_result
      changed_when: safety_net_action != 'status'

    - name: Show the result
      ansible.builtin.debug:
        msg: "{{ safety_net_result.stdout_lines }}"
