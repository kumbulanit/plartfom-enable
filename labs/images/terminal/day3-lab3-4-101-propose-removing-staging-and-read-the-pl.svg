<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 273" width="900" height="273" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve">
<rect width="900" height="273" rx="10" fill="#0d1117"/>
<rect width="900" height="28" rx="10" fill="#21262d"/><rect y="18" width="900" height="10" fill="#21262d"/>
<circle cx="20" cy="14" r="6" fill="#ff5f56"/><circle cx="40" cy="14" r="6" fill="#ffbd2e"/><circle cx="60" cy="14" r="6" fill="#27c93f"/>
<text x="450" y="19" fill="#8b949e" font-size="12" text-anchor="middle">Workspace terminal</text>
<text x="20" y="46"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> cd ~/environments</tspan></text>
<text x="20" y="65"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> git switch main &amp;&amp; git pull</tspan></text>
<text x="20" y="84"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> git switch -c $TEAM-remove-staging</tspan></text>
<text x="20" y="103"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> sed -i 's/\["staging", "prod"\]/["prod"]/' $TEAM.tf</tspan></text>
<text x="20" y="122"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> git diff</tspan></text>
<text x="20" y="141"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> git commit -am "Remove staging for $TEAM"</tspan></text>
<text x="20" y="160"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> git push -u origin $TEAM-remove-staging</tspan></text>
<text x="20" y="179" fill="#f85149">-  environments = ["staging", "prod"]</text>
<text x="20" y="198" fill="#3fb950">+  environments = ["prod"]</text>
<text x="20" y="217" fill="#c9d1d9">...</text>
<text x="20" y="236" fill="#c9d1d9">Plan: 0 to add, 0 to change, 8 to destroy.</text>
</svg>
