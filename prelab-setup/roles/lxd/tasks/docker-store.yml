---
# Docker stacks image layers with overlay mounts. On some hosts a container's disk cannot
# take them (a dir pool on a lab host that is itself a container), and every build fails
# with "failed to mount ... overlay ... invalid argument". Build a tiny image to find out;
# if it fails, switch that container's Docker to the vfs store: slower, works everywhere.
# Used by the runners and the workspaces (both run Docker, from the same image):
#   import_role: {name: lxd, tasks_from: docker-store}, with lxd_docker_store_containers.
- name: Check Docker can build images in each container, and switch to the vfs store if not
  ansible.builtin.command:
    argv:
      - lxc
      - exec
      - "{{ item }}"
      - --
      - bash
      - -c
      - |
        probe() {
          d=$(mktemp -d)
          echo x > "$d/f"
          printf 'FROM scratch\nCOPY f /f\nWORKDIR /srv\nCOPY f /srv/f\n' > "$d/Dockerfile"
          docker build -q -t pelab-storage-probe "$d" >/dev/null 2>&1; r=$?
          rm -rf "$d"; docker image rm -f pelab-storage-probe >/dev/null 2>&1
          return $r
        }
        for i in $(seq 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
        docker info >/dev/null 2>&1 || { echo "Docker is not running in {{ item }}" >&2; exit 1; }
        if probe; then echo "Docker builds images"; exit 0; fi
        cat > /etc/docker/daemon.json <<'EOF'
        {
          "log-driver": "json-file",
          "log-opts": {"max-size": "10m", "max-file": "3"},
          "features": {"containerd-snapshotter": false},
          "storage-driver": "vfs"
        }
        EOF
        systemctl restart docker
        if probe; then echo "Switched Docker to the vfs store"; else echo "Docker still cannot build images" >&2; exit 1; fi
  loop: "{{ lxd_docker_store_containers }}"
  register: lxd_docker_store
  changed_when: "'Switched' in lxd_docker_store.stdout"
