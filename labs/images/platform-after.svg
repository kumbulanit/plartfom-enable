<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="After platform engineering: one paved road for every team" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>After platform engineering: one paved road for every team</title><defs><marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="34" font-size="15" font-weight="700" fill="#2563eb" text-anchor="start">After: one paved road for every team</text><rect x="20" y="60" width="120" height="46" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="80.0" y="88.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Team A</text><polyline points="80,106 80,130" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><rect x="160" y="60" width="120" height="46" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="220.0" y="88.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Team B</text><polyline points="220,106 220,130" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><rect x="300" y="60" width="120" height="46" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="360.0" y="88.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Team C</text><polyline points="360,106 360,130" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><rect x="20" y="130" width="400" height="50" rx="8" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="220.0" y="151.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Self-service</text><text x="220.0" y="168.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">the portal, templates, and a pull request: no tickets</text><polyline points="220,180 220,205" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-accent)"/><rect x="20" y="205" width="400" height="153" rx="10" fill="#e8efff" stroke="#2563eb" stroke-width="1.5"/><text x="220" y="224" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Internal developer platform</text><text x="220" y="240" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">golden paths, with guardrails built in</text><rect x="30" y="250" width="120" height="44" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="90.0" y="268.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Code, review</text><text x="90.0" y="285.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">Gitea</text><rect x="160" y="250" width="120" height="44" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="220.0" y="268.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Pipeline</text><text x="220.0" y="285.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">Gitea Actions</text><rect x="290" y="250" width="120" height="44" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="350.0" y="268.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Images, scans</text><text x="350.0" y="285.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">Harbor</text><rect x="30" y="302" width="120" height="44" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="90.0" y="320.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Environments</text><text x="90.0" y="337.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">OpenTofu</text><rect x="160" y="302" width="120" height="44" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="220.0" y="320.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Deploy</text><text x="220.0" y="337.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">Argo CD</text><rect x="290" y="302" width="120" height="44" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.5"/><text x="350.0" y="320.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Observe</text><text x="350.0" y="337.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">Grafana</text><rect x="20" y="372" width="400" height="36" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="5 4"/><text x="220.0" y="395.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Infrastructure: Kubernetes, servers, network</text><rect x="440" y="230" width="140" height="100" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="510.0" y="276.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Platform team</text><text x="510.0" y="293.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">builds and runs it</text><text x="510.0" y="308.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">as a product:</text><text x="510.0" y="323.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">users, a roadmap</text><polyline points="440,280 420,280" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#a-ok)"/><polyline points="420,83 510,83 510,230" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a-ok)"/><text x="518.0" y="160.5" font-size="11" font-weight="400" fill="#15803d" text-anchor="start">feedback</text><text x="640" y="34" font-size="15" font-weight="700" fill="#15803d" text-anchor="start">What it gives the bank</text><rect x="640" y="60" width="340" height="58" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="810.0" y="85.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Faster</text><text x="810.0" y="102.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">minutes, not weeks</text><rect x="640" y="130" width="340" height="58" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="810.0" y="155.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Safer</text><text x="810.0" y="172.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">guardrails by default</text><rect x="640" y="200" width="340" height="58" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="810.0" y="225.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Consistent</text><text x="810.0" y="242.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">one path for every team</text><rect x="640" y="270" width="340" height="58" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="810.0" y="295.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Less to learn</text><text x="810.0" y="312.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">teams focus on their product</text><rect x="640" y="340" width="340" height="58" rx="8" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="810.0" y="365.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Audit-ready</text><text x="810.0" y="382.0" font-size="11" font-weight="400" fill="#616e7c" text-anchor="middle">evidence on every change</text></svg>
