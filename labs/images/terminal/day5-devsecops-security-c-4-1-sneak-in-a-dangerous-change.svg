<text x="450" y="19" fill="#8b949e" font-size="12" text-anchor="middle">Workspace terminal: type this</text>
<text x="20" y="46"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> cd ~/rates</tspan></text>
<text x="20" y="65"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> cat &gt;&gt; app/main.py &lt;&lt;'EOF'</tspan></text>
<text x="20" y="84"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> </tspan></text>
<text x="20" y="103"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> </tspan></text>
<text x="20" y="122"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> def calculate(text: str) -&gt; object:</tspan></text>
<text x="20" y="141"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc">     """Work out a sum a user typed, such as 2 + 3."""</tspan></text>
<text x="20" y="160"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc">     return eval(text)</tspan></text>
<text x="20" y="179"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> EOF</tspan></text>
<text x="20" y="198"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> printf 'PyYAML==5.3.1\n' &gt; requirements.txt</tspan></text>
<text x="20" y="217"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> git add app/main.py requirements.txt</tspan></text>
<text x="20" y="236"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> git commit -m "Add a calculator and a YAML library"</tspan></text>
<text x="20" y="255"><tspan fill="#7ee787">$</tspan><tspan fill="#f0f6fc"> git push</tspan></text>
